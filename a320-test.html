/* home */
function moduleCards(system){const hyd=system===HYD;return MODULES.filter(m=>m.system===system).map((m,i)=>{const qs=questionsInModule(m),seen=qs.filter(q=>tracking.seen[q.id]).length,miss=qs.filter(q=>tracking.misses[q.id]).length;
 return `<button type="button" class="mod ${hyd?'hyd':''}" data-module="${m.id}"><span class="k">BLOQUE ${pad(i+1)} · ${qs.length} preguntas</span><b>${esc(m.title)}</b><span class="d">${esc(m.desc)}</span><div class="bar ${hyd?'hyd':''}"><span style="width:${Math.round(100*seen/qs.length)}%"></span></div><span class="f"><span>${seen}/${qs.length} vistas</span>${miss?`<span class="err">${miss} por repasar</span>`:''}</span></button>`}).join('')}
function startModule(id){const m=MODULES.find(x=>x.id===id);if(!m)return;Object.assign(prefs,{system:m.system,module:m.id,theme:ALLTHEMES,count:String(questionsInModule(m).length),mode:'practica',only:'todos',difficult:false,order:true});startSession()}
function renderHome(){
 const saved=state.queue.length&&state.i<state.queue.length&&Object.keys(state.answers).length;
 const mods=MODULES.filter(m=>prefs.system===ANY||m.system===prefs.system);if(prefs.module!==ANYMODULE&&!mods.some(m=>m.id===prefs.module))prefs.module=ANYMODULE;
 const themes=themesFor(prefs.system);if(!themes.includes(prefs.theme))prefs.theme=ALLTHEMES;
 const available=filterPool().length,n=Math.min(available,Number(prefs.count)),base=filterPool('todos');
 const errHere=base.filter(q=>tracking.misses[q.id]).length,starHere=base.filter(q=>tracking.stars.includes(q.id)).length;
 const narrowed=prefs.system!==ANY||prefs.module!==ANYMODULE||prefs.theme!==ALLTHEMES||prefs.difficult;
 const counts=[...new Set([10,20,40,60,100,150,200,Number(prefs.count)])].filter(x=>x<available).sort((a,b)=>a-b);
 const countVal=Number(prefs.count)>=available?'all':String(prefs.count);
 // Explain an empty selection and offer the way out instead of a disabled button.
 let empty='';
 if(!available){
  const list=prefs.only==='fallos'?Object.keys(tracking.misses).map(Number):prefs.only==='favoritas'?tracking.stars:[];
  const err=prefs.only==='fallos',what=err?'errores':'preguntas marcadas';
  if(prefs.only!=='todos'&&!list.length)empty=`<p>Aún no tienes ${what}. ${prefs.only==='fallos'?'Aparecen aquí cuando fallas una pregunta.':'Marca preguntas con ☆ durante el test.'}</p>`;
  else if(prefs.only!=='todos'){
   const where=MODULES.map(m=>({m,c:questionsInModule(m).filter(q=>list.includes(q.id)).length})).filter(x=>x.c);
   empty=`<p>${err?'Ninguno':'Ninguna'} de tus ${list.length} ${what} está en esta selección. Están en: ${where.map(x=>`<button type="button" class="linkbtn" data-pick="${x.m.id}">${esc(x.m.title)} (${x.c})</button>`).join(', ')}.</p><button id="allList" class="btn primary">Practicar ${err?'los':'las'} ${list.length} ${what}</button>`;
  }else empty=`<p>Ninguna pregunta cumple estos filtros${prefs.difficult?' (en este apartado no hay preguntas marcadas como trampa)':''}.</p><button id="clearF" class="btn">Quitar filtros</button>`;
 }
 const sel=(id,label,opts,val)=>`<div><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
 $('#app').innerHTML=`<h1>A320 · Test de verdadero o falso</h1>
<p class="lead">400 afirmaciones sobre el sistema neumático (ATA 36) y el hidráulico verde (ATA 29), con la explicación y la diapositiva de clase en cada corrección. Elige un bloque para estudiar un mecanismo cada vez.</p>
<div class="stats"><span><b>${Object.keys(tracking.seen).length}</b>de 400 vistas</span><span><b>${numErrors()}</b>por repasar</span><span><b>${tracking.stars.length}</b>marcadas</span></div>
${saved?`<div class="card resume"><span>Tienes una sesión a medias: pregunta <b>${state.i+1}</b> de ${state.queue.length}, ${score()} aciertos.</span><button id="resume" class="btn primary">Continuar →</button></div>`:''}
<section class="sys"><div class="syshead"><h2><span class="dot"></span>Neumática · ATA 36</h2><span class="small">180 preguntas · 6 bloques</span></div><div class="mgrid">${moduleCards(NEU)}</div></section>
<section class="sys"><div class="syshead"><h2><span class="dot hyd"></span>Hidráulica GREEN · ATA 29</h2><span class="small">220 preguntas · 11 bloques</span></div><div class="mgrid">${moduleCards(HYD)}</div></section>
<section class="card pad custom"><h2>Sesión personalizada</h2><p class="small" style="margin:0">Mezcla materias, repite tus errores o haz un simulacro con la corrección al final.</p>
<div class="grid">
${sel('system','Materia',[[ANY,'Neumática + GREEN'],[NEU,'Solo neumática'],[HYD,'Solo hidráulica GREEN']],prefs.system)}
${sel('module','Bloque',[[ANYMODULE,'Todos los bloques'],...mods.map(m=>[m.id,m.title])],prefs.module)}
${sel('theme','Apartado',[[ALLTHEMES,'Todos'],...themes.map(t=>[t,t])],prefs.theme)}
${sel('count','Preguntas',[...counts.map(x=>[x,String(x)]),['all',`Todas (${available})`]],countVal)}
${sel('only','Cuáles',[['todos','Todas'],['fallos',`Mis errores (${narrowed?errHere+' de '+numErrors():numErrors()})`],['favoritas',`Marcadas (${narrowed?starHere+' de '+tracking.stars.length:tracking.stars.length})`]],prefs.only)}
${sel('challenge','Nivel',[['all','Todos los niveles'],['hard','Solo trampas y difíciles']],prefs.difficult?'hard':'all')}
${sel('mode','Corrección',[['practica','Tras cada pregunta'],['simulacro','Al final (simulacro)']],prefs.mode)}
</div>
<div class="row" style="justify-content:space-between"><label class="check"><input id="order" type="checkbox" ${prefs.order?'checked':''}> Orden aleatorio</label>
${available?`<button id="start" class="btn primary lg">Empezar ${n} pregunta${n===1?'':'s'} →</button>`:''}</div>
${available?`<p class="small" style="margin:.6rem 0 0">${available} preguntas cumplen los filtros${n<available?`; se usarán ${n} al azar`:''}.</p>`:`<div class="emptybox">${empty}</div>`}</section>`;
 const bind={system:v=>{prefs.system=v;prefs.module=ANYMODULE;prefs.theme=ALLTHEMES},module:v=>{prefs.module=v;prefs.theme=ALLTHEMES},theme:v=>prefs.theme=v,count:v=>prefs.count=v==='all'?'400':v,only:v=>prefs.only=v,challenge:v=>prefs.difficult=v==='hard',mode:v=>prefs.mode=v};
 for(const [id,f] of Object.entries(bind))$('#'+id).onchange=e=>{f(e.target.value);save();renderHome()};
 $('#order').onchange=e=>{prefs.order=e.target.checked;save()};
 document.querySelectorAll('[data-module]').forEach(el=>el.onclick=()=>startModule(el.dataset.module));
 if($('#start'))$('#start').onclick=()=>startSession();
 document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{const m=MODULES.find(x=>x.id===el.dataset.pick);Object.assign(prefs,{system:m.system,module:m.id,theme:ALLTHEMES,difficult:false});save();renderHome();$('.custom').scrollIntoView({block:'nearest'})});
 if($('#allList'))$('#allList').onclick=()=>startSession(prefs.only==='fallos'?Object.keys(tracking.misses).map(Number):tracking.stars,prefs.mode);
 if($('#clearF'))$('#clearF').onclick=()=>{Object.assign(prefs,{system:ANY,module:ANYMODULE,theme:ALLTHEMES,difficult:false});save();renderHome()};
 if(saved)$('#resume').onclick=()=>go('quiz');
}
function startSession(fixed=null,mode=null){let pool=fixed?fixed.map(id=>BY_ID.get(id)).filter(Boolean):filterPool();if(!pool.length){alert('No hay preguntas con esos filtros.');return}
 pool=prefs.order?shuffle(pool):pool;if(!fixed)pool=pool.slice(0,Number(prefs.count));
 state={phase:'quiz',queue:pool.map(q=>q.id),i:0,answers:{},mode:mode||prefs.mode,recorded:false,started:Date.now()};peek=false;save();render();toTop()}

/* quiz */
function renderQuiz(){const q=BY_ID.get(state.queue[state.i]);if(!q){finish();return}
 const sel=state.answers[q.id],done=typeof sel==='boolean',reveal=done&&state.mode==='practica',ok=sel===q.answer;
 const N=state.queue.length,n=answered(),good=score(),starred=tracking.stars.includes(q.id),hyd=q.system===HYD;
 const figFirst=FIG_FIRST.has(q.id),shownAbove=figFirst||(peek&&!done)||(peek&&done&&!reveal);
 const pages=q.pdfPages||[],last=state.i===N-1;
 const cls=v=>{if(reveal){if(v===q.answer)return 'correct';if(v===sel)return 'wrong';return 'dim'}if(done)return v===sel?'picked':'dim';return ''};
 const tag=v=>reveal&&v===q.answer?'<span class="tag">Correcta</span>':reveal&&v===sel?'<span class="tag">Tu respuesta</span>':done&&v===sel?'<span class="tag">Tu respuesta</span>':'';
 $('#app').innerHTML=`<div class="qbar"><button id="stop" class="btn ghost" title="Volver al menú (la sesión se guarda)">✕</button><div class="bar"><span style="width:${100*n/N}%"></span></div><span class="count">${state.i+1} / ${N}${state.mode==='practica'?` · <span class="g">✓ ${good}</span> <span class="r">✕ ${n-good}</span>`:''}</span></div>
<article class="card qcard">
<div class="chips"><span class="chip ${hyd?'hyd':'neu'}">${hyd?'Hidráulica GREEN':'Neumática'}</span><span class="chip">${esc(q.theme.replace(/^(GREEN|NEU) · /,''))}</span>${q.exam?'<span class="chip warn">Trampa de examen</span>':''}<button id="star" type="button" class="star ${starred?'on':''}" aria-pressed="${starred}">${starred?'★ Marcada':'☆ Marcar'}</button></div>
<p class="claim">${esc(q.claim)}</p>
${shownAbove?slidesHtml(q,pages):(!done&&pages.length?`<div class="peek"><button id="peek" type="button" class="btn">🖼 Ver la diapositiva ${pages.join(' y ')}</button></div>`:'')}
<div class="choices"><button id="chooseTrue" class="choice ${cls(true)}" ${done?'disabled':''}><kbd>V</kbd>Verdadero${tag(true)}</button><button id="chooseFalse" class="choice ${cls(false)}" ${done?'disabled':''}><kbd>F</kbd>Falso${tag(false)}</button></div>
${reveal?`<div class="fb ${ok?'':'bad'}" id="fb"><h3>${ok?'✓ Correcto':'✕ Incorrecto'} · la afirmación es ${q.answer?'verdadera':'falsa'}</h3><p>${esc(q.why)}</p><div class="src">Fuente: ${esc(q.source)}</div>${shownAbove?'':slidesHtml(q,pages)}</div>`:''}
${done&&!reveal?`<div class="fb neutral" id="fb"><h3>Respuesta guardada</h3><p class="small">En el simulacro la corrección aparece al terminar.</p></div>`:''}
${done?`<div class="next" id="nextrow"><button id="prev" class="btn ghost" ${state.i?'':'disabled'}>← Anterior</button><span class="hint">Pulsa <kbd>Enter</kbd> o <kbd>→</kbd></span><button id="next" class="btn primary lg">${last?'Ver resultados':'Siguiente pregunta →'}</button></div>`
:`<div class="qfoot"><button id="prev" class="btn ghost" ${state.i?'':'disabled'}>← Anterior</button><span>Teclas: <b>V</b> verdadero · <b>F</b> falso</span></div>`}
</article>`;
 $('#star').onclick=()=>{const s=new Set(tracking.stars);s.has(q.id)?s.delete(q.id):s.add(q.id);tracking.stars=[...s];save();renderQuiz()};
 $('#chooseTrue').onclick=()=>chooseAnswer(true);$('#chooseFalse').onclick=()=>chooseAnswer(false);
 if($('#peek'))$('#peek').onclick=()=>{peek=true;renderQuiz()};
 $('#prev').onclick=()=>move(-1);if($('#next'))$('#next').onclick=()=>move(1);
 $('#stop').onclick=()=>go('home');
}
function move(d){const q=BY_ID.get(state.queue[state.i]);if(d>0&&typeof state.answers[q.id]!=='boolean')return;const j=state.i+d;if(j<0)return;peek=false;
 if(j>=state.queue.length){finish();return}state.i=j;save();renderQuiz();toTop()}
function chooseAnswer(v){if(state.phase!=='quiz')return;const q=BY_ID.get(state.queue[state.i]);if(typeof state.answers[q.id]==='boolean')return;
 state.answers[q.id]=v;tracking.seen[q.id]=(tracking.seen[q.id]||0)+1;if(v===q.answer)delete tracking.misses[q.id];else tracking.misses[q.id]=(tracking.misses[q.id]||0)+1;
 save();renderQuiz();$('#next')?.focus({preventScroll:true})}
function finish(){state.phase='result';if(!state.recorded){const total=state.queue.length;tracking.history.unshift({when:new Date().toISOString(),total,correct:score(),mode:state.mode});tracking.history=tracking.history.slice(0,25);state.recorded=true}save();renderResult();toTop()}

/* results */
function trow(label,ok,total,hyd){return `<div class="trow"><span>${label}</span><div class="bar ${hyd?'hyd':''}"><span style="width:${total?Math.round(100*ok/total):0}%"></span></div><b>${ok}/${total}</b></div>`}
function renderResult(){const qs=getQuestions(),total=qs.length,good=score(),bad=qs.filter(q=>state.answers[q.id]!==q.answer),pct=Math.round(100*good/Math.max(1,total));
 const msg=pct>=90?'Dominio muy sólido. Repasa los pocos fallos.':pct>=75?'Buena base: afina cifras y condiciones.':pct>=55?'Hay conceptos por consolidar: repite los fallos por bloques.':'Repasa la chuleta y haz sesiones cortas por bloque.';
 const bySys=[NEU,HYD].map(s=>{const l=qs.filter(q=>q.system===s);return {s,ok:l.filter(q=>state.answers[q.id]===q.answer).length,total:l.length}}).filter(b=>b.total);
 $('#app').innerHTML=`<h1>Resultado</h1><section class="card pad"><div class="score"><div class="big">${pct}<small>%</small></div><div><b>${good} de ${total} correctas</b> · ${bad.length} fallos<br><span class="small">${msg}</span></div></div>
${bySys.map(b=>trow(esc(b.s),b.ok,b.total,b.s===HYD)).join('')}
<div class="row" style="margin-top:1rem"><button id="retry" class="btn primary" ${bad.length?'':'disabled'}>Repetir los ${bad.length} fallos</button><button id="new" class="btn">Nueva sesión</button><button id="export" class="btn ghost" ${bad.length?'':'disabled'}>Descargar fallos (.txt)</button></div></section>
<h2 style="margin-top:1.6rem">${bad.length?'Tus fallos, explicados':'Sin fallos en esta sesión'}</h2>
<section class="card pad">${bad.length?bad.map(q=>`<div class="review"><div class="meta">${esc(q.system)} · ${esc(q.theme)} · ${esc(q.source)}</div><p class="c">${esc(q.claim)}</p><div class="ans">${typeof state.answers[q.id]==='boolean'?`Respondiste ${state.answers[q.id]?'verdadero':'falso'}`:'Sin responder'} · es ${q.answer?'verdadera':'falsa'}</div><p style="margin:.3rem 0 0">${esc(q.why)}</p>${slidesHtml(q,q.pdfPages||[])}</div>`).join(''):'<p class="empty">Prueba otro bloque o el simulacro.</p>'}</section>`;
 $('#retry').onclick=()=>startSession(bad.map(q=>q.id),'practica');$('#new').onclick=()=>go('home');$('#export').onclick=()=>exportErrors(bad)}
function exportErrors(list){const out=['A320 - repaso de fallos',new Date().toLocaleString('es-ES'),'',...list.flatMap((q,i)=>[`${i+1}. [${q.system} / ${q.theme}]`,q.claim,`Respuesta: ${q.answer?'VERDADERO':'FALSO'}`,`Por qué: ${q.why}`,`Diapositivas: ${(q.pdfPages||[]).join(', ')} (${DECK[q.system].name})`,''])].join('\r\n');
 const url=URL.createObjectURL(new Blob(['﻿'+out],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='A320_fallos.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

/* progress */
function renderProgress(){const err=Object.keys(tracking.misses).map(id=>BY_ID.get(Number(id))).filter(Boolean);
 $('#app').innerHTML=`<h1>Mis errores y progreso</h1><p class="lead">Un fallo sale de la lista cuando aciertas esa pregunta en otra sesión. Todo se guarda en este navegador.</p>
<div class="stats"><span><b>${Object.keys(tracking.seen).length}</b>vistas</span><span><b>${err.length}</b>por repasar</span><span><b>${tracking.stars.length}</b>marcadas</span><span><b>${tracking.history.length}</b>sesiones</span></div>
<div class="row" style="margin-bottom:1.2rem"><button id="errors" class="btn primary" ${err.length?'':'disabled'}>Practicar mis ${err.length} errores</button><button id="stars" class="btn" ${tracking.stars.length?'':'disabled'}>Practicar mis ${tracking.stars.length} marcadas</button></div>
<section class="card pad"><h2>Por bloque</h2>${MODULES.map(m=>{const qs=questionsInModule(m),seen=qs.filter(q=>tracking.seen[q.id]).length,e=qs.filter(q=>tracking.misses[q.id]).length;return trow(`${esc(m.title)}${e?` <span style="color:var(--bad);font-size:.8rem">· ${e} fallos</span>`:''}`,seen,qs.length,m.system===HYD)}).join('')}</section>
<section class="card pad" style="margin-top:1rem"><h2>Últimas sesiones</h2>${tracking.history.length?tracking.history.slice(0,12).map(h=>`<div class="trow"><span>${esc(new Date(h.when).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}))} · ${h.mode==='practica'?'práctica':'simulacro'}</span><div class="bar"><span style="width:${Math.round(100*h.correct/h.total)}%"></span></div><b>${h.correct}/${h.total}</b></div>`).join(''):'<p class="empty">Aún no has terminado ninguna sesión.</p>'}</section>`;
 $('#errors').onclick=()=>startSession(err.map(q=>q.id),'practica');$('#stars').onclick=()=>startSession(tracking.stars,'practica')}

/* guide */
function renderGuide(){
 const nums=r=>`<table class="nums"><tbody>${r.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table>`;
 const users={id:0,system:HYD};
 $('#app').innerHTML=`<h1>Chuleta de cifras y trampas</h1><p class="lead">Los valores de las diapositivas de clase, que es donde el examen cambia un número o una condición para volver falsa una afirmación.</p>
<div class="g2"><section class="card pad"><h2><span class="dot"></span> Neumática · ATA 36</h2>${nums([['5ª / 9ª','Etapas del compresor: intermedia / alta.'],['36 ± 4 psi','HPV, toma de alta.'],['44 ± 4 psi','PRV, regulación de sangrado.'],['57 psi','Sobrepresión que detecta la BMC para cerrar el sangrado.'],['73,8–89,9 psi','Zona de cierre de la OPV.'],['200 ± 15 °C','Temperatura objetivo a la salida del precooler (TCT/FAV).'],['235–245 °C','Limitación térmica del TLT.'],['257 °C','Corte por sobretemperatura supervisado.']])}</section>
<section class="card pad"><h2><span class="dot hyd"></span> Hidráulica GREEN · ATA 29</h2>${nums([['3000 psi','Presión nominal del GREEN.'],['18 / 14 / 3 l','Depósito: máximo / normal / aviso LOW LEVEL.'],['50 / 22 psi','Aire del depósito / aviso LO AIR PRESS.'],['500 psi','Diferencia de presión que activa la PTU en AUTO.'],['1740 psi','Presostato de baja presión de la bomba.'],['1450 psi','Presostato del colector de alta presión.'],['3500 / 3200 psi','Válvula de alivio: apertura / cierre.'],['1885 psi / 1 l','Precarga de N₂ del acumulador a 20 °C / capacidad.'],['87 / 29 psi','Δp de obstrucción: filtro de alta / de retorno.']])}</section></div>
<div class="g2"><section class="card pad"><h2>5 trampas de neumática</h2><ul><li><b>HPV:</b> se necesita a baja potencia; con la etapa 5 suficiente se cierra. No confundir 36 con 44 psi.</li><li><b>PRV:</b> regula la presión; cerrarla también cierra la HPV, pero no al revés.</li><li><b>TLT:</b> protege por temperatura y por flujo inverso; la BMC puede cerrar eléctricamente.</li><li><b>FAV:</b> regula aire frío del fan, no combustible; más temperatura → más refrigeración.</li><li><b>X-BLEED:</b> AUTO sigue a APU BLEED bajo condiciones; OPEN/SHUT es mando manual con el otro motor eléctrico.</li></ul></section>
<section class="card pad"><h2>5 trampas del GREEN</h2><ul><li><b>PTU:</b> transfiere potencia, <b>nunca líquido</b>, y puede ayudar al GREEN.</li><li><b>Dos presostatos:</b> 1740 de la bomba y 1450 del colector; no son el mismo.</li><li><b>Alivio:</b> abre a 3500 y cierra a 3200; no invertir.</li><li><b>Depósito / acumulador:</b> 18 l máximo / 1 l con N₂; no confundir el aire a 50 psi con los 3000 del circuito.</li><li><b>Válvula de prioridad:</b> protege los mandos primarios recortando usuarios menos prioritarios; medida de fugas normalmente ABIERTA.</li></ul></section></div>
<section class="card pad"><h2>Diapositiva 7 · usuarios que hay que memorizar</h2><div class="users"><div class="gr"><b>Verde</b>Dirección de la rueda de morro · tren de aterrizaje · frenada normal · reversa del motor 1</div><div class="bl"><b>Azul</b>Generador de emergencia CSM/G (Constant Speed Motor/Generator)</div><div class="ye"><b>Amarillo</b>Frenada alternativa · reversa del motor 2 · puertas de carga</div></div>
${slidesHtml(users,[7])}<p class="small" style="margin:0">El esquema tiene más actuadores, pero solo se pregunta por estas asociaciones.</p></section>
<div class="row" style="margin-top:1.2rem"><button id="startNeu" class="btn primary">40 de neumática</button><button id="startHyd" class="btn">40 del GREEN</button><button id="startMix" class="btn ghost">Simulacro mixto de 60</button></div>`;
 const quick=(system,count,mode)=>()=>{Object.assign(prefs,{system,module:ANYMODULE,theme:ALLTHEMES,count:String(count),only:'todos',difficult:false,order:true});startSession(null,mode)};
 $('#startNeu').onclick=quick(NEU,40,'practica');$('#startHyd').onclick=quick(HYD,40,'practica');$('#startMix').onclick=quick(ANY,60,'simulacro')}

$('#nav-test').onclick=()=>go('home');
$('#nav-guide').onclick=()=>go('guide');$('#nav-progress').onclick=()=>go('progress');
document.addEventListener('keydown',e=>{if(state.phase!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||$('#lb').open||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))return;
 const k=e.key.toLowerCase(),done=typeof state.answers[state.queue[state.i]]==='boolean';
 if(!done&&(k==='v'||k==='1'))chooseAnswer(true);else if(!done&&(k==='f'||k==='2'))chooseAnswer(false);
 else if(done&&(k==='enter'||k==='arrowright')){e.preventDefault();move(1)}else if(k==='arrowleft')move(-1)});
render();
</script>
