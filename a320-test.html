ios de GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":192,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"La reversa del motor 1 se alimenta únicamente desde el depósito de agua potable.","why":"La presentación sitúa REVERSE ENGINE 1 entre los usuarios de GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":193,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"En la diapositiva 7, LANDING GEAR aparece entre los usuarios del circuito verde.","why":"El esquema sitúa LANDING GEAR en el ramal GREEN. Ojo: las CARGO DOORS (puertas de carga) están en YELLOW; no son las puertas del tren.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":194,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"Las puertas de carga (CARGO DOORS) se accionan desde el verde porque LANDING GEAR pertenece a ese circuito.","why":"LANDING GEAR se indica en GREEN, pero CARGO DOORS aparece en el ramal YELLOW. Son conceptos distintos.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":195,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"El circuito azul alimenta el CSM/G, correspondiente al generador de emergencia.","why":"La diapositiva 7 sitúa el CSM/G en BLUE. CSM/G significa Constant Speed Motor/Generator y está señalado en tus anotaciones como generador de emergencia.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":196,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"El CSM/G (generador de emergencia) aparece como usuario del sistema amarillo.","why":"CSM/G figura en BLUE, no en YELLOW; en este tema del azul solo necesitas reconocer ese usuario.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":197,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"La frenada alternativa (ALTERNATE BRAKES) se asocia al sistema amarillo.","why":"En la diapositiva 7, ALTERNATE BRAKES está en YELLOW. Por el contrario, NORMAL BRAKES está en GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":198,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"La frenada normal depende del amarillo y la frenada alternativa depende del verde.","why":"Las asociaciones están invertidas: GREEN → NORMAL BRAKES; YELLOW → ALTERNATE BRAKES.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":199,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"La reversa del motor 2 y las puertas de carga aparecen entre los usuarios del sistema amarillo.","why":"En el ramal YELLOW se leen REVERSE ENGINE 2 y CARGO DOORS. La reversa del motor 1 está en GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":200,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"El circuito amarillo es el que proporciona la dirección de rueda de morro y el movimiento del tren de aterrizaje.","why":"NOSE WHEEL STEERING y LANDING GEAR están señalados en GREEN. El amarillo tiene, entre los usuarios que has de recordar, frenada alternativa, reversa del motor 2 y puertas de carga.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":201,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"La bomba verde accionada por motor es de desplazamiento variable.","why":"La diapositiva 2 especifica EDP de desplazamiento variable, y la 8 indica autorregulación.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":202,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"La bomba EDP verde es de desplazamiento fijo y nunca cambia su caudal geométrico.","why":"La diapositiva 2 especifica EDP de desplazamiento variable, y la 8 indica autorregulación.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":203,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"La EDP gira con la caja de accesorios cuando gira el motor 1.","why":"El arrastre mecánico procede del motor; la selección de presión depende del mecanismo de regulación.","source":"Hidráulica GREEN, pág. 2","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":204,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"La EDP verde solo gira cuando se enciende la luz FAULT de la bomba.","why":"El arrastre mecánico procede del motor; la selección de presión depende del mecanismo de regulación.","source":"Hidráulica GREEN, pág. 2","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":205,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"La inclinación del plato de una bomba axial de pistones afecta a la carrera de los pistones.","why":"El plato o yoke determina desplazamiento por vuelta y, con ello, el volumen impulsado.","source":"Hidráulica GREEN, pág. 2","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":206,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"El plato inclinable de la EDP solo cambia la lectura de temperatura de la cabina.","why":"El plato o yoke determina desplazamiento por vuelta y, con ello, el volumen impulsado.","source":"Hidráulica GREEN, pág. 2","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":207,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"Seleccionar ENG 1 PUMP OFF puede anular la entrega de presión sin detener mecánicamente el giro de la bomba.","why":"La bomba accionada por el motor continúa girando; el control varía su desplazamiento hacia neutro.","source":"Hidráulica GREEN, pág. 2, 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,4]},{"id":208,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"Seleccionar ENG 1 PUMP OFF desacopla físicamente la bomba del motor y la detiene por completo en todos los casos.","why":"La bomba accionada por el motor continúa girando; el control varía su desplazamiento hacia neutro.","source":"Hidráulica GREEN, pág. 2, 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,4]},{"id":209,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"Con el plato de pistones en posición neutra, la bomba puede seguir girando sin aportar caudal útil de alta presión.","why":"Sin carrera efectiva no hay desplazamiento hidráulico significativo.","source":"Hidráulica GREEN, pág. 2","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":210,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"Con el plato en neutra la bomba produce obligatoriamente 3000 psi de presión de salida.","why":"Sin carrera efectiva no hay desplazamiento hidráulico significativo.","source":"Hidráulica GREEN, pág. 2","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":211,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"La EDP del verde regula automáticamente su caudal para mantener la presión del circuito próxima a 3000 psi.","why":"La autorregulación se efectúa por variación del desplazamiento, no porque un motor eléctrico acelere la EDP.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":212,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"La EDP mantiene 3000 psi elevando constantemente su régimen independientemente del motor.","why":"La autorregulación se efectúa por variación del desplazamiento, no porque un motor eléctrico acelere la EDP.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":213,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"El depósito presurizado ayuda a que la bomba verde reciba fluido en aspiración y permanezca cebada.","why":"La presurización de succión reduce la cavitación y facilita la alimentación de la bomba.","source":"Hidráulica GREEN, pág. 8, 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,10]},{"id":214,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"Para que funcione la EDP, debe aspirar siempre fluido con presión inferior al vacío absoluto.","why":"La presurización de succión reduce la cavitación y facilita la alimentación de la bomba.","source":"Hidráulica GREEN, pág. 8, 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,10]},{"id":215,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"El mismo fluido hidráulico de la bomba también participa en su lubricación y refrigeración.","why":"El retorno de drenaje de carcasa devuelve fluido que lubrica y refrigera la bomba.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":216,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"La EDP requiere obligatoriamente una línea de combustible de motor como lubricante interno.","why":"El retorno de drenaje de carcasa devuelve fluido que lubrica y refrigera la bomba.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":217,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"La bomba verde tiene una línea de drenaje de carcasa con filtro de retorno al depósito.","why":"El drenaje de la carcasa retorna al depósito a través de filtración específica.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":218,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"Todo el caudal de lubricación de la bomba debe dirigirse directamente a los actuadores del tren.","why":"El drenaje de la carcasa retorna al depósito a través de filtración específica.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":219,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":true,"claim":"El aviso de filtro de drenaje de carcasa obstruido se relaciona con una caída diferencial de 87 psi.","why":"87 psi es el diferencial de obstrucción del filtro; 3000 psi es la presión nominal del circuito.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":220,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Bomba EDP y potencia","answer":false,"claim":"El filtro de drenaje de la bomba se considera obstruido solo al alcanzar 3000 psi de diferencia de presión.","why":"87 psi es el diferencial de obstrucción del filtro; 3000 psi es la presión nominal del circuito.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":221,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El depósito verde tiene una capacidad máxima indicada de 18 litros.","why":"La diapositiva 8 cifra 18 l máximo para el depósito; el acumulador es de 1 l.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":222,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"La capacidad máxima del depósito verde es de 1 litro, igual que su acumulador.","why":"La diapositiva 8 cifra 18 l máximo para el depósito; el acumulador es de 1 l.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":223,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El volumen normal indicado para el depósito verde es aproximadamente 14 litros.","why":"14 l es la referencia de volumen normal; 3 l es el umbral de bajo nivel.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":224,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El volumen normal del depósito verde se fija en 3 litros, que corresponde a nivel máximo.","why":"14 l es la referencia de volumen normal; 3 l es el umbral de bajo nivel.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":225,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El aviso de nivel bajo del depósito verde está asociado a un contenido de aproximadamente 3 litros.","why":"La señal LOW LEVEL se activa al descender hasta el umbral indicado de 3 l.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":226,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El aviso de nivel bajo del depósito verde salta exactamente al alcanzar el máximo de 18 litros.","why":"La señal LOW LEVEL se activa al descender hasta el umbral indicado de 3 l.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":227,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El depósito verde se presuriza nominalmente con aire a unos 50 psi.","why":"Los 50 psi corresponden al aire del depósito; los 3000 psi al fluido hidráulico presurizado por la bomba.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":228,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"La presurización del aire del depósito verde debe mantenerse nominalmente en 3000 psi.","why":"Los 50 psi corresponden al aire del depósito; los 3000 psi al fluido hidráulico presurizado por la bomba.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":229,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El aviso de presión de aire baja del depósito verde aparece hacia los 22 psi.","why":"22 psi es un umbral de presión de aire de presurización, no una medida de cantidad de fluido.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":230,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El aviso LO AIR PRESS del depósito verde se produce únicamente cuando el líquido hidráulico alcanza 22 litros.","why":"22 psi es un umbral de presión de aire de presurización, no una medida de cantidad de fluido.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":231,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"La presurización con aire evita, entre otras cosas, que la bomba pierda cebado o cavite.","why":"La presión de aire ayuda a mantener la entrada de la bomba abastecida de fluido.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":232,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El aire del depósito tiene por misión disminuir la presión de succión hasta provocar cavitación.","why":"La presión de aire ayuda a mantener la entrada de la bomba abastecida de fluido.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":233,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"Normalmente, la presurización de los depósitos puede proceder de una toma de alta del compresor del motor 1.","why":"En el repaso se identifica la etapa 8 de alta del motor 1 como fuente habitual, con respaldos neumáticos.","source":"Hidráulica GREEN, pág. 8, 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,10],"sourceCaution":"La referencia concreta a la etapa 8 aparece como detalle complementario de clase; verifica la fuente exacta en el esquema, porque no figura escrita con claridad en el texto de la diapositiva."},{"id":234,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El aire de presurización de depósitos procede únicamente del líquido del acumulador de frenos.","why":"En el repaso se identifica la etapa 8 de alta del motor 1 como fuente habitual, con respaldos neumáticos.","source":"Hidráulica GREEN, pág. 8, 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,10],"sourceCaution":"La referencia concreta a la etapa 8 aparece como detalle complementario de clase; verifica la fuente exacta en el esquema, porque no figura escrita con claridad en el texto de la diapositiva."},{"id":235,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El sistema neumático general puede actuar como respaldo para presurizar depósitos si falta la fuente normal del motor 1.","why":"La red neumática puede suministrar aire mediante la interconexión de respaldo.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":236,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"Si falla el motor 1, no existe ninguna vía alternativa de suministro neumático a los depósitos.","why":"La red neumática puede suministrar aire mediante la interconexión de respaldo.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":237,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"El depósito verde incorpora medios de inspección o indicación de cantidad, además de sensores.","why":"La diapositiva 10 representa un indicador directo acoplado al depósito.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":238,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El depósito verde carece de indicador local de cantidad y solo puede inspeccionarse abriendo su tapa.","why":"La diapositiva 10 representa un indicador directo acoplado al depósito.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":239,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":true,"claim":"En el depósito verde, una variación de nivel puede detectarse mediante un sensor capacitivo que usa el fluido como dieléctrico.","why":"El detector de nivel usa un condensador cuyo comportamiento cambia con la cantidad de fluido hidráulico.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":240,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Depósito y aire","answer":false,"claim":"El detector de bajo nivel verde mide la presión del combustible de la APU mediante un pitot.","why":"El detector de nivel usa un condensador cuyo comportamiento cambia con la cantidad de fluido hidráulico.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":241,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"La PTU permite transferir potencia entre el verde y el circuito vecino sin mezclar sus fluidos hidráulicos.","why":"La PTU tiene motor y bomba hidráulicos mecánicamente acoplados por un eje; los fluidos permanecen separados.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":242,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La PTU equilibra las presiones vertiendo directamente fluido verde dentro del depósito del otro circuito.","why":"La PTU tiene motor y bomba hidráulicos mecánicamente acoplados por un eje; los fluidos permanecen separados.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":243,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"La PTU puede funcionar para ayudar al verde cuando este pierde su presión principal y la otra parte dispone de presión suficiente.","why":"La unidad es bidireccional según cuál de los dos lados tenga presión y demanda.","source":"Hidráulica GREEN, pág. 2, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":244,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La PTU solo puede transferir potencia desde el verde y nunca hacia el verde.","why":"La unidad es bidireccional según cuál de los dos lados tenga presión y demanda.","source":"Hidráulica GREEN, pág. 2, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":245,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"En AUTO, una diferencia de presión del orden de 500 psi es el criterio de actuación de la PTU.","why":"Las transparencias indican dP 500 psi para la actuación automática.","source":"Hidráulica GREEN, pág. 2, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":246,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La PTU actúa normalmente con solo 5 psi de diferencia entre las ramas.","why":"Las transparencias indican dP 500 psi para la actuación automática.","source":"Hidráulica GREEN, pág. 2, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":247,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"El pulsador PTU OFF evita que la PTU opere automáticamente.","why":"La electroválvula de control puede cortar la operación de la PTU cuando se ordena OFF.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":248,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"El pulsador PTU OFF aumenta la diferencia necesaria hasta 3000 psi, pero mantiene la PTU en operación.","why":"La electroválvula de control puede cortar la operación de la PTU cuando se ordena OFF.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":249,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"La PTU tiene una electroválvula de control en su manifold del sistema verde.","why":"El PTU MANIFOLD de la diapositiva 9 incluye SOLENOID VALVE para cortar su operación.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":250,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La PTU es gobernada exclusivamente por una válvula de climatización del pack 2.","why":"El PTU MANIFOLD de la diapositiva 9 incluye SOLENOID VALVE para cortar su operación.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":251,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"El manifold de la PTU del verde contiene dos válvulas antirretorno.","why":"El material enumera expresamente dos check valves.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":252,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"El manifold de la PTU del verde se caracteriza por no tener ninguna válvula antirretorno.","why":"El material enumera expresamente dos check valves.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":253,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"Durante la secuencia de arranque de motores, puede estar inhibida la operación automática de la PTU.","why":"Los sistemas inhiben ciertos arranques automáticos para evitar transferencia de potencia no deseada.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9],"sourceCaution":"La inhibición durante ciertos arranques procede del funcionamiento estudiado y de ejemplos de examen; las diapositivas señaladas muestran el control de la PTU, no enumeran allí todas las condiciones."},{"id":254,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La PTU debe arrancar siempre en cuanto se inicia cualquier motor, sin posibilidad de inhibición.","why":"Los sistemas inhiben ciertos arranques automáticos para evitar transferencia de potencia no deseada.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9],"sourceCaution":"La inhibición durante ciertos arranques procede del funcionamiento estudiado y de ejemplos de examen; las diapositivas señaladas muestran el control de la PTU, no enumeran allí todas las condiciones."},{"id":255,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"La apertura de las puertas de carga con el sistema asociado puede llevar a la inhibición de la PTU.","why":"La lógica de inhibición evita actividad inesperada de la unidad; no se transfiere fluido entre sistemas.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9],"complementaryPages":[13],"sourceCaution":"La condición concreta de inhibición por puertas de carga figura en la página 13 del mismo PDF, dentro del apartado amarillo (fuera de tu temario); aquí solo se pregunta su relación con la PTU."},{"id":256,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La operación de puertas de carga obliga a que la PTU transfiera fluido al verde para compensar su movimiento.","why":"La lógica de inhibición evita actividad inesperada de la unidad; no se transfiere fluido entre sistemas.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9],"complementaryPages":[13],"sourceCaution":"La condición concreta de inhibición por puertas de carga figura en la página 13 del mismo PDF, dentro del apartado amarillo (fuera de tu temario); aquí solo se pregunta su relación con la PTU."},{"id":257,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"Si la bomba del motor 1 pierde presión pero la PTU sigue disponible, el verde puede seguir siendo alimentado por la PTU.","why":"La PTU puede convertir potencia recibida por su eje en presión hidráulica para el verde.","source":"Hidráulica GREEN, pág. 2, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":258,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"Si se avería la EDP verde, la presión verde tiene que ser cero aunque la PTU esté disponible y autorizada.","why":"La PTU puede convertir potencia recibida por su eje en presión hidráulica para el verde.","source":"Hidráulica GREEN, pág. 2, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":259,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":true,"claim":"La PTU no sustituye la necesidad de que el circuito verde conserve su propio líquido hidráulico.","why":"Como no traspasa fluido, la PTU no resuelve una pérdida total de líquido del circuito receptor.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":260,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · PTU y transferencia","answer":false,"claim":"La PTU permite mantener el verde presurizado aun cuando su depósito está completamente vacío de líquido.","why":"Como no traspasa fluido, la PTU no resuelve una pérdida total de líquido del circuito receptor.","source":"Hidráulica GREEN, pág. 2, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":261,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"En el panel superior, ENG 1 PUMP es el mando de la bomba verde accionada por motor.","why":"ENG 1 PUMP corresponde a la EDP verde; APU BLEED es un mando neumático diferente.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":262,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"El mando de la bomba verde en el panel superior se llama APU BLEED.","why":"ENG 1 PUMP corresponde a la EDP verde; APU BLEED es un mando neumático diferente.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":263,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"En operación normal, el pulsador ENG 1 PUMP puede aparecer sin leyenda iluminada.","why":"El pulsador se presenta oscuro normalmente; la leyenda OFF indica selección de desactivación.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":264,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"Para demostrar funcionamiento normal, ENG 1 PUMP debe mostrar siempre la palabra OFF en blanco.","why":"El pulsador se presenta oscuro normalmente; la leyenda OFF indica selección de desactivación.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":265,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"Una indicación FAULT ámbar asociada a ENG 1 PUMP advierte de una condición anormal.","why":"FAULT es una advertencia de fallo, no la señal de operación normal.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":266,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"Una indicación FAULT ámbar significa que la bomba verde funciona en su mejor estado y no hay anomalías.","why":"FAULT es una advertencia de fallo, no la señal de operación normal.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":267,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"El panel del sistema hidráulico incluye un mando PTU con estados AUTO/OFF y aviso FAULT.","why":"El panel superior incorpora selector/ pulsador para la PTU.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":268,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"La PTU solo puede controlarse quitando manualmente la carcasa de la bomba en el pilón.","why":"El panel superior incorpora selector/ pulsador para la PTU.","source":"Hidráulica GREEN, pág. 4","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[4]},{"id":269,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"La página HYD del ECAM muestra presiones de los sistemas hidráulicos y estados de sus elementos.","why":"Las indicaciones incluyen presión hidráulica, bomba, depósitos y PTU, entre otros.","source":"Hidráulica GREEN, pág. 5","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5]},{"id":270,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"La página HYD del ECAM solo representa la temperatura del aire exterior.","why":"Las indicaciones incluyen presión hidráulica, bomba, depósitos y PTU, entre otros.","source":"Hidráulica GREEN, pág. 5","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5]},{"id":271,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"Un símbolo de bomba en línea y verde en ECAM indica suministro de presión por esa bomba.","why":"La representación verde en línea refleja un elemento que suministra presión en el esquema.","source":"Hidráulica GREEN, pág. 5","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5]},{"id":272,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"En la página HYD, un símbolo de bomba en línea y verde obliga a interpretarlo como bomba desconectada.","why":"La representación verde en línea refleja un elemento que suministra presión en el esquema.","source":"Hidráulica GREEN, pág. 5","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5]},{"id":273,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"La indicación LO ámbar junto a la bomba verde se asocia a una presión insuficiente a su salida.","why":"El interruptor de presión de la bomba tiene umbral de baja presión, unos 1740 psi.","source":"Hidráulica GREEN, pág. 5, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5,8]},{"id":274,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":false,"claim":"La indicación LO ámbar de la bomba verde confirma una salida exactamente de 3000 psi.","why":"El interruptor de presión de la bomba tiene umbral de baja presión, unos 1740 psi.","source":"Hidráulica GREEN, pág. 5, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5,8]},{"id":275,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Cabina, panel y ECAM","answer":true,"claim":"Una válvula de fuego del verde cruzada en ámbar en ECAM representa su cierre completo.","why":"La simbología di mulador del verde comunica libremente el gas N₂ y el líquido hidráulico para que se mezclen.","why":"El dibujo de la diapositiva 11 muestra una bolsa de goma separadora entre ambos medios.","source":"Hidráulica GREEN, pág. 11","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[11]},{"id":329,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","answer":true,"claim":"El acumulador del verde presenta una envoltura reforzada, descrita con Kevlar.","why":"El esquema indica carcasa de acero y refuerzo de Kevlar.","source":"Hidráulica GREEN, pág. 11","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[11]},{"id":330,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","answer":false,"claim":"El acumulador está hecho exclusivamente de cristal sin carcasa metálica ni refuerzo.","why":"El esquema indica carcasa de acero y refuerzo de Kevlar.","source":"Hidráulica GREEN, pág. 11","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[11]},{"id":331,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","answer":true,"claim":"La válvula de alivio actúa como protección frente a presión excesiva y devuelve fluido al retorno.","why":"Cuando se vence el muelle a la presión de apertura, se comunica el circuito de alta con retorno.","source":"Hidráulica GREEN, pág. 8, 11","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,11]},{"id":332,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","answer":false,"claim":"La válvula de alivio solo puede aumentar la presión sin abrir ningún circuito de descarga.","why":"Cuando se vence el muelle a la presión de apertura, se comunica el circuito de alta con retorno.","source":"Hidráulica GREEN, pág. 8, 11","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,11]},{"id":333,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","an  · ATA 29","theme":"GREEN · Acumulador y retorno","answer":false,"claim":"Un acumulador precargado con nitrógeno es completamente rígido y no varía su volumen de gas al presurizarse.","why":"El gas compresible modifica su volumen y permite almacenar fluido conforme sube la presión.","source":"Hidráulica GREEN, pág. 11","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[11]},{"id":339,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","answer":true,"claim":"Que el sistema verde tenga 3000 psi normales no significa que el acumulador deba precargarse a esos mismos 3000 psi.","why":"Son magnitudes de funcionamiento distintas: 1885 psi de N₂ frente a 3000 psi de fluido nominal.","source":"Hidráulica GREEN, pág. 8, 11","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,11]},{"id":340,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Acumulador y retorno","answer":false,"claim":"La precarga del acumulador siempre tiene que ser idéntica a la presión nominal del sistema, 3000 psi.","why":"Son magnitudes de funcionamiento distintas: 1885 psi de N₂ frente a 3000 psi de fluido nominal.","source":"Hidráulica GREEN, pág. 8, 11","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,11]},{"id":341,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"La válvula de prioridad del verde preserva el suministro disponible hacia los mandos de vuelo primarios cuando la presión baja.","why":"Su objetivo explícito es mantener presión para controles de vuelo críticos.","source":"Hidráulica GREEN, pág. 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":342,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"La válvula de prioridad desvía el poco caudal disponible preferentemente hacia las puertas de carga y deja sin alimentación los mandos primarios.","why":"Su ob marios, no a incrementar la demanda de consumidores como el tren de aterrizaje.","source":"Hidráulica GREEN, pág. 7, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7,9]},{"id":347,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"En el bloque de PTU verde existe una válvula selectora que puede cortar la alimentación a los frenos normales.","why":"El PTU MANIFOLD incluye normal brake selector valve, para controlar el suministro hidráulico a los frenos.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":348,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"La válvula selectora de frenos normales sirve para aumentar la temperatura de la FAV neumática.","why":"El PTU MANIFOLD incluye normal brake selector valve, para controlar el suministro hidráulico a los frenos.","source":"Hidráulica GREEN, pág. 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[9]},{"id":349,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"Una caída suficiente de presión verde puede hacer que dejen de estar disponibles los frenos normales.","why":"Normal brakes es un usuario verde, por lo que puede perder alimentación si el suministro verde cae.","source":"Hidráulica GREEN, pág. 7, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7,9]},{"id":350,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"Los frenos normales nunca dependen de la presión del sistema verde.","why":"Normal brakes es un usuario verde, por lo que puede perder alimentación si el suministro verde cae.","source":"Hidráulica GREEN, pág. 7, 9","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7,9]},{"id":351,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"La BSCU recibe información de presión verde para la gestión de frenos y dirección.","why":"La BSCU aparece entre los destinatarios del presostato del colector HP.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":352,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"La BSCU únicamente controla los climatizadores y no recibe ninguna información hidráulica.","why":"La BSCU aparece entre los destinatarios del presostato del colector HP.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":353,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"La válvula de medida de fugas del verde da paso a varios grupos de mandos de vuelo primarios.","why":"La diapositiva 8 divide los consumidores detrás de la válvula por cola y alas.","source":"Hidráulica GREEN, pág. 3, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[3,8]},{"id":354,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"La válvula de medida de fugas del verde abastece exclusivamente a la calefacción de bodega.","why":"La diapositiva 8 divide los consumidores detrás de la válvula por cola y alas.","source":"Hidráulica GREEN, pág. 3, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[3,8]},{"id":355,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"En la diapositiva 7, los cuatro usuarios principales del verde que hay que memorizar son dirección de rueda de morro, tren de aterrizaje, frenos normales y reversa del motor 1.","why":"En tus anotaciones están marcados NOSE WHEEL STEERING, LANDING GEAR, NORMAL BRAKES y REVERSE ENGINE 1. Son los cuatro que debes memorizar de esta diapositiva; el diagrama completo presenta más conexiones.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":356,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"La frenada alternativa y las puertas de carga son dos de los cuatro usuarios marcados para memorizar del verde.","why":"ALTERNATE BRAKES y CARGO DOORS están en YELLOW. Los seleccionados del GREEN son NOSE WHEEL STEERING, LANDING GEAR, NORMAL BRAKES y REVERSE ENGINE 1.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":357,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"La reversa del motor 1 es usuaria del verde, mientras que la reversa del motor 2 es usuaria del amarillo.","why":"Se distinguen en la diapositiva 7 como REVERSE ENGINE 1 (GREEN) y REVERSE ENGINE 2 (YELLOW). Es una trampa típica intercambiarlas.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":358,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"La reversa de los motores 1 y 2 aparece alimentada por el mismo circuito verde.","why":"La reversa del motor 1 aparece en GREEN y la del motor 2 en YELLOW, no las dos en verde.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":359,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":true,"claim":"El CSM/G corresponde al azul; la frenada normal al verde; y la frenada alternativa al amarillo.","why":"Son las tres asociaciones de la diapositiva 7: BLUE → CSM/G (generador de emergencia); GREEN → NORMAL BRAKES; YELLOW → ALTERNATE BRAKES.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":360,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Prioridad, frenos y mandos","answer":false,"claim":"En la diapositiva 7, el CSM/G depende del verde y la dirección de rueda de morro depende del azul.","why":"Se han intercambiado los sistemas: el CSM/G está en BLUE y el NOSE WHEEL STEERING en GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":361,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"Una gran parte de los componentes del verde se sitúa en la zona del alojamiento del tren principal.","why":"La figura de localización representa elementos accesibles en el entorno del tren principal.","source":"Hidráulica GREEN, pág. 8, 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,10]},{"id":362,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"Los componentes del sistema verde se concentran exclusivamente en el interior de la cabina de pasajeros.","why":"La figura de localización representa elementos accesibles en el entorno del tren principal.","source":"Hidráulica GREEN, pág. 8, 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8,10]},{"id":363,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"La válvula cortafuegos del verde se localiza en el pilón izquierdo del motor 1.","why":"La diapositiva 8 especifica pylon LH y su función de aislar la alimentación de la EDP.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":364,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"La válvula cortafuegos verde se encuentra dentro del depósito de agua potable, sin relación con el motor.","why":"La diapositiva 8 especifica pylon LH y su función de aislar la alimentación de la EDP.","source":"Hidráulica GREEN, pág. 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":365,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"El pulsador de fuego del motor 1 puede mandar cerrar la válvula cortafuegos hidráulica verde.","why":"En una condición de fuego se aísla el suministro del depósito a la bomba en el área afectada.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":366,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"El pulsador de fuego del motor 1 manda abrir completamente la válvula cortafuegos verde para alimentar las llamas.","why":"En una condición de fuego se aísla el suministro del depósito a la bomba en el área afectada.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":367,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"En la parte baja del depósito verde hay una válvula de drenaje que permite vaciarlo por gravedad.","why":"En la diapositiva 10 aparece una drain valve en la parte inferior y se anota el vaciado por gravedad.","source":"Hidráulica GREEN, pág. 10","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":368,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"El depósito verde solo puede vaciarse mediante su válvula de aire en lo alto del avión.","why":"En la diapositiva 10 aparece una drain valve en la parte inferior y se anota el vaciado por gravedad.","source":"Hidráulica GREEN, pág. 10","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":369,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"El conjunto de aire del depósito incorpora manómetro, presostato y válvula antirretorno.","why":"El esquema del depósito identifica elementos para medir y mantener la presurización del aire.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":370,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"El bloque de aire del depósito contiene únicamente una toma de llenado de combustible.","why":"El esquema del depósito identifica elementos para medir y mantener la presurización del aire.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":371,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"El indicador mecánico de cantidad del depósito transmite el movimiento de un flotador.","why":"En la diapositiva 10 se representa float arm enlazado con quantity indicator.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":372,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"El indicador local de cantidad del verde estima litros exclusivamente por la temperatura de la APU.","why":"En la diapositiva 10 se representa float arm enlazado con quantity indicator.","source":"Hidráulica GREEN, pág. 10","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[10]},{"id":373,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"Desde el panel de servicio asociado al sistema verde pueden llenarse depósitos hidráulicos de los tres circuitos.","why":"El material recalca el panel de servicio del verde y una válvula selectora para distintos depósitos.","source":"Hidráulica GREEN, pág. 2, 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,12]},{"id":374,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"Cada depósito solo puede llenarse desde un panel exclusivo en el motor que lo alimenta.","why":"El material recalca el panel de servicio del verde y una válvula selectora para distintos depósitos.","source":"Hidráulica GREEN, pág. 2, 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,12]},{"id":375,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"Una válvula selectora en el panel de servicio permite elegir qué depósito se llena.","why":"El selector del panel determina el depósito hidráulico receptor durante mantenimiento.","source":"Hidráulica GREEN, pág. 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[12]},{"id":376,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"La válvula selectora de llenado únicamente permite elegir qué pack de aire acondicionado enfría.","why":"El selector del panel determina el depósito hidráulico receptor durante mantenimiento.","source":"Hidráulica GREEN, pág. 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[12]},{"id":377,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"El panel de servicio incluye una bomba manual de llenado que no es la bomba manual destinada a mover puertas de carga.","why":"Son funciones diferentes: llenar depósitos hidráulicos frente a accionar usuarios mediante presión hidráulica.","source":"Hidráulica GREEN, pág. 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[12]},{"id":378,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"La bomba manual de llenado del verde es exactamente la bomba que abre las puertas de carga durante el vuelo.","why":"Son funciones diferentes: llenar depósitos hidráulicos frente a accionar usuarios mediante presión hidráulica.","source":"Hidráulica GREEN, pág. 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[12]},{"id":379,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":true,"claim":"El panel permite conectar un equipo hidráulico de tierra mediante tomas de aspiración y de presión.","why":"El panel tiene suction/pressure ports para pruebas y presurización en mantenimiento.","source":"Hidráulica GREEN, pág. 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[12]},{"id":380,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Ubicación y panel servicio","answer":false,"claim":"Un carro hidráulico de tierra no puede conectarse al sistema verde bajo ninguna circunstancia.","why":"El panel tiene suction/pressure ports para pruebas y presurización en mantenimiento.","source":"Hidráulica GREEN, pág. 12","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[12]},{"id":381,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si hay 3000 psi de fluido hidráulico y 50 psi de aire en el depósito verde, ambos valores pueden ser correctos a la vez.","why":"Las magnitudes corresponden a zonas y cometidos diferentes, no a la misma línea de presión.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":382,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Si en el sistema verde se miden 3000 psi de fluido, el aire del depósito debe estar también a 3000 psi.","why":"Las magnitudes corresponden a zonas y cometidos diferentes, no a la misma línea de presión.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":383,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si el depósito verde alcanza 3 litros, un aviso de nivel bajo es compatible con que su aire permanezca a 50 psi.","why":"LOW LEVEL mide litros; LO AIR PRESS depende de la presión del aire, que puede ser normal.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":384,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Si el depósito llega a 3 litros, el aviso que corresponde obligatoriamente es LO AIR PRESS aunque el aire esté a 50 psi.","why":"LOW LEVEL mide litros; LO AIR PRESS depende de la presión del aire, que puede ser normal.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":385,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si la presión de bomba verde baja de 1740 psi, puede dispararse LO antes del umbral de 1450 psi del presostato del colector.","why":"1740 psi es superior a 1450 psi; durante una caída progresiva se alcanza primero 1740.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":386,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"La indicación LO del interruptor de bomba verde se produce obligatoriamente después del aviso del colector a 1450 psi.","why":"1740 psi es superior a 1450 psi; durante una caída progresiva se alcanza primero 1740.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":387,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si el sistema alcanza 3600 psi, la válvula de alivio ya habría sobrepasado su presión de apertura de 3500 psi.","why":"La protección abre a 3500 psi y cierra cuando se reduce a 3200.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":388,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"A 3600 psi la válvula de alivio del verde aún no alcanza los 3200 psi necesarios para abrir.","why":"La protección abre a 3500 psi y cierra cuando se reduce a 3200.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":389,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si la válvula de alivio abrió por sobrepresión, puede permanecer abierta mientras la presión desciende desde 3500 hacia 3200 psi.","why":"El comportamiento tiene un intervalo de histéresis que evita vibraciones de apertura y cierre.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":390,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Una vez abierta, la válvula de alivio se cierra inmediatamente al bajar un solo psi desde 3500.","why":"El comportamiento tiene un intervalo de histéresis que evita vibraciones de apertura y cierre.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":391,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si el depósito pierde fluido por una fuga externa, el indicador de cantidad puede caer sin que la primera señal sea necesariamente OVHT.","why":"El descenso de cantidad detecta una fuga externa; el calentamiento depende del funcionamiento y fugas internas.","source":"Hidráulica GREEN, pág. 5, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5,8]},{"id":392,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Cualquier fuga externa de aceite hidráulico hace saltar automáticamente y primero un aviso de sobretemperatura.","why":"El descenso de cantidad detecta una fuga externa; el calentamiento depende del funcionamiento y fugas internas.","source":"Hidráulica GREEN, pág. 5, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[5,8]},{"id":393,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si el verde pierde su EDP y la PTU puede suministrarle potencia, el nivel de líquido del depósito verde no tiene por qué variar por intercambio con el otro circuito.","why":"La PTU mueve energía mediante eje, no líquido entre depósitos.","source":"Hidráulica GREEN, pág. 2, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":394,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Si la PTU alimenta al verde, el depósito verde se llena automáticamente con líquido procedente del otro circuito.","why":"La PTU mueve energía mediante eje, no líquido entre depósitos.","source":"Hidráulica GREEN, pág. 2, 9","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,9]},{"id":395,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si las bombas siguen girando con ENG 1 PUMP seleccionado OFF, eso no demuestra que el verde reciba 3000 psi.","why":"El giro mecánico continúa, pero el mecanismo de desplazamiento variable puede anular la entrega.","source":"Hidráulica GREEN, pág. 2, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":396,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Una EDP acoplada al motor siempre genera 3000 psi aunque su mando esté OFF.","why":"El giro mecánico continúa, pero el mecanismo de desplazamiento variable puede anular la entrega.","source":"Hidráulica GREEN, pág. 2, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":397,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si se cierra una válvula de medición de fugas en mantenimiento, puede cortarse temporalmente la alimentación de los usuarios que quedan detrás.","why":"El cierre separa el grupo para comprobar caudales, por eso no se usa en funcionamiento normal.","source":"Hidráulica GREEN, pág. 3, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[3,8]},{"id":398,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Cerrar la válvula de medición de fugas aumenta el caudal hacia todos los servos de vuelo del grupo aislado.","why":"El cierre separa el grupo para comprobar caudales, por eso no se usa en funcionamiento normal.","source":"Hidráulica GREEN, pág. 3, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[3,8]},{"id":399,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":true,"claim":"Si se dispara el aviso de filtro HP obstruido con 87 psi de diferencial, no significa que la presión de todo el circuito haya bajado a 87 psi.","why":"La presión diferencial entre entrada y salida del filtro no equivale a la presión absoluta de suministro.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]},{"id":400,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Casos trampa de examen","answer":false,"claim":"Un aviso de diferencial 87 psi en el filtro HP obliga a que el sistema completo esté funcionando a 87 psi.","why":"La presión diferencial entre entrada y salida del filtro no equivale a la presión absoluta de suministro.","source":"Hidráulica GREEN, pág. 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[8]}];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pad=n=>String(n).padStart(2,'0');
function questionsInModule(m){return BANK.filter(q=>q.system===m.system&&m.themes.includes(q.theme))}

 [193,194,195,196,197,198,199,200,345,346,355,356,357,358,359,360].forEach(id=>{delete tracking.seen[id];delete tracking.misses[id];delete state.answers[id]});

 lbList=[...document.querySelectorAll(`.slide[data-group="${b.dataset.group}"]`)].map(x=>({src:x.dataset.src,cap:x.dataset.cap})).filter((x,i,a)=>a.findIndex(y=>y.src===x.src)===i);
 lbAt=Math.max(0,lbList.findIndex(x=>x.src===b.dataset.src));lbShow();$('#lb').showModal()});
