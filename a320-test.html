const BANK=[{"id":1,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":true,"claim":"El sistema neumático distribuye aire procedente de fuentes del avión o conectadas a él hacia distintos sistemas consumidores.","why":"La definición de la diapositiva 3 incluye fuentes internas y externas, y usuarios como climatización, arranque, antihielo y presurización.","source":"Neumática, pág. 3","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[3]},{"id":2,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":false,"claim":"El sistema neumático se utiliza exclusivamente para el arranque de los motores.","why":"Además del arranque, suministra aire a acondicionamiento de cabina, protección antihielo y presurización de otros sistemas.","source":"Neumática, pág. 3, 4","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[3,4]},{"id":3,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":true,"claim":"El acondicionamiento de cabina comprende tanto la presurización como la regulación de temperatura.","why":"Ambas funciones aparecen expresamente dentro de los usos del sistema neumático.","source":"Neumática, pág. 4","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[4]},{"id":4,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":false,"claim":"Para arrancar un motor solo puede utilizarse aire procedente del APU.","why":"El temario cita tres fuentes posibles: equipo de tierra, APU y otro motor.","source":"Neumática, pág. 4, 11","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[4,11]},{"id":5,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":true,"claim":"Entre los sistemas que pueden presurizarse mediante aire neumático están los depósitos hidráulicos y de agua potable.","why":"La diapositiva 4 menciona ambos depósitos como usuarios de aire presurizado.","source":"Neumática, pág. 4","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[4]},{"id":6,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":false,"claim":"Las reversas de empuje y la alimentación de bombas hidráulicas mediante ADP son ejemplos de regulación de temperatura en cabina.","why":"Se enumeran bajo la función de fuerza motriz, no bajo el acondicionamiento de cabina.","source":"Neumática, pág. 4","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[4]},{"id":7,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":true,"claim":"Los motores son la principal fuente de aire a presión y temperatura elevadas descrita en el temario.","why":"El aire se extrae de etapas del compresor, donde su presión y su temperatura ya son elevadas.","source":"Neumática, pág. 5","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[5]},{"id":8,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":false,"claim":"El APU solo proporciona energía eléctrica y nunca potencia neumática.","why":"El APU se describe como una turbina auxiliar capaz de suministrar tanto energía eléctrica como potencia neumática.","source":"Neumática, pág. 5","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[5]},{"id":9,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":true,"claim":"En las diapositivas se citan presiones de sangrado de motor entre 50 y 410 psi como valores orientativos asociados a distintos regímenes.","why":"La diapositiva 5 presenta ese intervalo junto con temperaturas aproximadamente entre 180 y 540 °C; no son presiones constantes a la salida de las válvulas reguladoras.","source":"Neumática, pág. 5","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[5]},{"id":10,"system":"Neumática · ATA 36","theme":"Funciones y fuentes","answer":false,"claim":"El equipo neumático de tierra constituye la principal fuente de aire del avión durante el crucero.","why":"El equipo de tierra se utiliza en tierra, por ejemplo para tareas de mantenimiento; el sangrado de los motores es la fuente principal descrita durante la operación.","source":"Neumática, pág. 5","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[5]},{"id":11,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":true,"claim":"En el esquema genérico, los sistemas de aire acondicionado son consumidores del aire de la red neumática.","why":"Los packs reciben aire desde la distribución neumática para el sistema de control ambiental o ECS.","source":"Neumática, pág. 6","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[6]},{"id":12,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":false,"claim":"Una válvula SOV está destinada a aumentar la temperatura del aire por compresión.","why":"SOV significa shut-off valve: su función esencial es permitir o interrumpir un suministro, no comprimir el aire.","source":"Neumática, pág. 6","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[6]},{"id":13,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":true,"claim":"Una válvula de alimentación cruzada puede comunicar dos ramas de la distribución neumática.","why":"En el esquema se representa una conexión entre las ramas que posibilita compartir la fuente de suministro cuando está abierta.","source":"Neumática, pág. 6","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[6]},{"id":14,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":false,"claim":"El aire de sangrado para el sistema se extrae siempre de la misma etapa del compresor, con independencia del régimen.","why":"El documento diferencia el sangrado de una etapa más alta a bajo régimen y de una intermedia cuando aumenta el régimen.","source":"Neumática, pág. 7","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7]},{"id":15,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":true,"claim":"Al ralentí puede ser necesario sangrar de una etapa de compresión más alta para disponer de presión suficiente.","why":"La diapositiva 7 explica que, a ralentí, se utiliza la vía de alta presión, mientras a regímenes mayores puede usarse una etapa intermedia.","source":"Neumática, pág. 7","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7]},{"id":16,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":false,"claim":"La válvula antirretorno del sangrado intermedio se utiliza para forzar el flujo hacia atrás, hacia el compresor.","why":"Su cometido es impedir un flujo en sentido contrario al previsto; no producirlo.","source":"Neumática, pág. 7","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7]},{"id":17,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":true,"claim":"El precooler enfría el sangrado caliente mediante otra corriente de aire procedente del fan.","why":"El aire más frío del fan atraviesa el intercambiador y extrae calor del aire de sangrado.","source":"Neumática, pág. 7","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7]},{"id":18,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":false,"claim":"La Fan Air Valve regula directamente el caudal de combustible inyectado en el motor.","why":"Controla el paso de aire del fan que refrigera el sangrado en el precooler; no el combustible.","source":"Neumática, pág. 7, 33","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7,33]},{"id":19,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":true,"claim":"La válvula de regulación de presión mostrada está controlada eléctricamente y actuada neumáticamente.","why":"Las órdenes llegan mediante señales eléctricas, mientras la fuerza física que mueve el mecanismo se obtiene neumáticamente.","source":"Neumática, pág. 8","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[8]},{"id":20,"system":"Neumática · ATA 36","theme":"Esquema y sangrado","answer":false,"claim":"El mecanismo de mariposa de una válvula de regulación de presión no interviene en la regulación del caudal.","why":"La posición de la mariposa modifica el paso disponible y permite intervenir en la regulación de presión; también posibilita el cierre.","source":"Neumática, pág. 8","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[8]},{"id":21,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":true,"claim":"El antihielo de ala aprovecha aire caliente para calentar la cara interior de su borde de ataque.","why":"El documento describe un conducto perforado que distribuye aire caliente por el interior de la estructura protegida.","source":"Neumática, pág. 9","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[9]},{"id":22,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":false,"claim":"Los conductos de antihielo del borde de ataque son necesariamente completamente rígidos y carecen de uniones móviles.","why":"La diapositiva 9 menciona tubos telescópicos y acoples flexibles para conducir aire hacia los slats.","source":"Neumática, pág. 9","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[9]},{"id":23,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":true,"claim":"Los sensores de sobrepresión y sobretemperatura contribuyen a proteger la estructura del ala si el antihielo funciona incorrectamente.","why":"Según la diapositiva 9, permiten actuar sobre la válvula de antihielo para interrumpir el suministro.","source":"Neumática, pág. 9","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[9]},{"id":24,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":false,"claim":"La finalidad del sistema antihielo es enfriar el borde de ataque hasta temperaturas inferiores a 0 °C.","why":"Su finalidad es aportar calor para prevenir o eliminar la formación de hielo en las zonas protegidas.","source":"Neumática, pág. 9","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[9]},{"id":25,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":true,"claim":"La protección antihielo del motor emplea aire caliente dirigido a zonas de la entrada o carenado del fan.","why":"La diapositiva 10 señala válvulas de antihielo en la carcasa del fan que gobiernan el suministro al capó de fan.","source":"Neumática, pág. 10","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[10]},{"id":26,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":false,"claim":"La tripulación no puede recibir ninguna indicación de presión sobre el funcionamiento del antihielo de motor.","why":"El material explica que un interruptor de presión permite comprobar la activación correcta del sistema.","source":"Neumática, pág. 10","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[10]},{"id":27,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":true,"claim":"La starter valve debe abrirse para permitir que el aire accione el motor de arranque neumático.","why":"Con la válvula abierta, el aire acciona el arrancador conectado a la caja de accesorios e inicia el giro del motor.","source":"Neumática, pág. 11","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[11]},{"id":28,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":false,"claim":"En el procedimiento explicado, se introduce combustible antes de que el motor empiece a girar.","why":"Primero se inicia el giro mediante el arrancador neumático; posteriormente, al alcanzarse determinadas revoluciones, se introduce combustible y se establece la ignición.","source":"Neumática, pág. 11","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[11]},{"id":29,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":true,"claim":"En tus anotaciones se distingue entre crank en seco y crank en húmedo.","why":"Los comentarios manuscritos anotan la distinción entre giro sin combustible y giro con combustible, respectivamente; el término crank por sí solo indica el giro del motor.","source":"Neumática, pág. 11","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[11]},{"id":30,"system":"Neumática · ATA 36","theme":"Usuarios y arranque","answer":false,"claim":"El aire de sangrado destinado al sistema hidráulico se utiliza únicamente para accionar directamente los actuadores de control de vuelo.","why":"El temario señala que presuriza depósitos hidráulicos y, en ciertos diseños, puede accionar bombas; no describe ese uso exclusivo.","source":"Neumática, pág. 12","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[12]},{"id":31,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":true,"claim":"El esquema general del A320 incluye una conexión de tierra de alta presión, un conducto de alimentación cruzada y una válvula de sangrado del APU.","why":"Estos elementos están etiquetados en la imagen de la diapositiva 13.","source":"Neumática, pág. 13","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[13]},{"id":32,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":false,"claim":"La figura general del A320 sitúa el precooler en el interior de los depósitos de agua potable.","why":"En el dibujo aparece vinculado a la zona del motor y al recorrido de sangrado, no al depósito de agua.","source":"Neumática, pág. 13","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[13]},{"id":33,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":true,"claim":"Con la crossbleed cerrada, cada motor puede alimentar el pack de su propio lado.","why":"La diapositiva 14 señala que la válvula separa los dos lados y que cada motor alimenta su paquete cuando está cerrada.","source":"Neumática, pág. 14","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14]},{"id":34,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":false,"claim":"La alimentación neumática desde tierra se conecta directamente al lado derecho del colector transversal del A320.","why":"El documento sitúa tanto la conexión de tierra como la del APU en el lado izquierdo, identificado como lado 1.","source":"Neumática, pág. 14","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14]},{"id":35,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":true,"claim":"La crossbleed abierta permite que una única fuente alimente usuarios de los dos lados del sistema.","why":"Al comunicar las ramas, una fuente disponible puede abastecer el conjunto de usuarios conectados, sujeto a las condiciones de funcionamiento.","source":"Neumática, pág. 14","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14]},{"id":36,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":false,"claim":"El documento describe que el motor 2, y nunca el motor 1, alimenta la calefacción de la bodega trasera.","why":"La diapositiva 14 atribuye específicamente esa alimentación al motor 1.","source":"Neumática, pág. 14","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14]},{"id":37,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":true,"claim":"Al seleccionar APU BLEED ON, la descripción del sistema indica que se abren los sangrados de APU y se cierran automáticamente los sangrados de motor.","why":"La prioridad del aire de APU evita utilizar simultáneamente los sangrados de motor en la configuración descrita.","source":"Neumática, pág. 15","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[15]},{"id":38,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":false,"claim":"Que el APU tenga prioridad implica que todos los sangrados de motor permanecen obligatoriamente abiertos junto al del APU.","why":"La diapositiva 15 expone lo contrario: las válvulas de sangrado de motor se cierran cuando se selecciona el suministro de APU.","source":"Neumática, pág. 15","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[15]},{"id":39,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":true,"claim":"En X-BLEED AUTO, la crossbleed sigue la posición de la válvula de sangrado de APU en la operación normal que explican las diapositivas.","why":"AUTO abre la crossbleed cuando se usa el sangrado de APU y la cierra cuando no, con las condiciones y excepciones de protección tratadas después.","source":"Neumática, pág. 16, 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":40,"system":"Neumática · ATA 36","theme":"Distribución A320","answer":false,"claim":"Situar el selector X-BLEED en OPEN equivale a ordenar manualmente el cierre de la crossbleed.","why":"OPEN ordena la apertura manual; SHUT corresponde a la posición de cierre.","source":"Neumática, pág. 16, 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":41,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":true,"claim":"Los BMC son computadores encargados de supervisar el funcionamiento del sangrado neumático de los motores.","why":"BMC corresponde a Bleed Monitoring Computer y el documento identifica uno asociado a cada lado o motor.","source":"Neumática, pág. 17, 18","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[17,18]},{"id":42,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":false,"claim":"Los BMC obtienen información solo de los mandos de cabina, sin sensores de temperatura ni presión.","why":"Reciben señales de mandos, posiciones de válvulas, transmisores de presión, sensores de temperatura y otros equipos.","source":"Neumática, pág. 18","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18]},{"id":43,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":true,"claim":"Los BMC pueden ordenar el corte del sangrado correspondiente cuando se detecta un fallo.","why":"El temario les atribuye funciones de supervisión, protección y cierre en caso de fallo.","source":"Neumática, pág. 18","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18]},{"id":44,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":false,"claim":"Los dos BMC funcionan de forma completamente aislada y no intercambian información.","why":"La diapositiva 18 indica que se comunican entre sí y reciben información de otros computadores.","source":"Neumática, pág. 18","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18]},{"id":45,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":true,"claim":"Los BMC generan información que puede mostrarse en ECAM a demanda o ante determinadas averías.","why":"La diapositiva 19 describe la presentación del estado neumático a la tripulación mediante ECAM.","source":"Neumática, pág. 19","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":46,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":false,"claim":"Los lazos detectores de pérdidas se instalan dentro de la cámara de combustión para medir directamente la combustión.","why":"Se disponen en paralelo a conductos neumáticos para detectar posibles pérdidas o fugas en la distribución de aire.","source":"Neumática, pág. 19","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":47,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":true,"claim":"Una fuga detectada en un conducto neumático puede provocar el aislamiento de la zona mediante el cierre de una válvula de sangrado.","why":"El BMC utiliza la información del lazo detector para cortar el suministro correspondiente y reducir posibles daños.","source":"Neumática, pág. 19","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":48,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":false,"claim":"Si se detecta una fuga neumática, el sistema debe abrir siempre todas las válvulas de sangrado para equilibrar la presión.","why":"La protección descrita busca aislar la zona afectada mediante cierre de válvulas, no distribuir la fuga.","source":"Neumática, pág. 19","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":49,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":true,"claim":"En el esquema ECAM mostrado, los trazos verdes indican el recorrido neumático presurizado o disponible en esa representación.","why":"Tus anotaciones al lado de la imagen interpretan las líneas verdes como zonas que tienen aire a presión.","source":"Neumática, pág. 19","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":50,"system":"Neumática · ATA 36","theme":"BMC y supervisión","answer":false,"claim":"La selección de X-BLEED es irrelevante para los BMC, que no reciben ninguna señal de esa válvula.","why":"La posición de X-BLEED figura explícitamente entre las señales utilizadas por los BMC.","source":"Neumática, pág. 18","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18]},{"id":51,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":true,"claim":"La conexión de aire neumático de tierra incorpora una válvula antirretorno.","why":"Así se permite la alimentación hacia el avión y se limita el retorno del aire por esa toma.","source":"Neumática, pág. 20","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[20]},{"id":52,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":false,"claim":"Para suministrar aire con un grupo neumático de tierra es necesario conectar la manguera por el extremo del ala.","why":"La diapositiva 20 sitúa la toma en la zona inferior izquierda del fuselaje.","source":"Neumática, pág. 20","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[20]},{"id":53,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":true,"claim":"El acceso al conector neumático de tierra se encuentra en la parte inferior izquierda del fuselaje, según el material.","why":"El documento especifica la ubicación de un registro que permite conectar la manguera del grupo de tierra.","source":"Neumática, pág. 20","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[20]},{"id":54,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":false,"claim":"La válvula antirretorno en la conexión de tierra sirve para elevar la temperatura del suministro.","why":"Una válvula antirretorno limita el flujo en sentido inverso; no está destinada a calentar el aire.","source":"Neumática, pág. 20","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[20]},{"id":55,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":true,"claim":"El sangrado del APU se introduce en el lado izquierdo del conducto transversal neumático del A320.","why":"La diapositiva 21 lo afirma explícitamente y la 14 coincide en esa distribución.","source":"Neumática, pág. 14, 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,21]},{"id":56,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":false,"claim":"Según el material, el sangrado de APU está disponible a cualquier altitud, sin límite citado.","why":"La diapositiva 21 indica suministro en vuelo hasta 20 000 ft, no disponibilidad sin límite.","source":"Neumática, pág. 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[21]},{"id":57,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":true,"claim":"En el sistema expuesto, la APU BLEED VALVE dispone de accionamiento neumático y control por solenoide.","why":"El accionador utiliza presión neumática y el solenoide gobierna la orden eléctrica de mando.","source":"Neumática, pág. 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[21]},{"id":58,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":false,"claim":"La APU BLEED VALVE se presenta como una válvula de accionamiento puramente manual y sin control eléctrico.","why":"Se especifica que se acciona neumáticamente y se controla mediante solenoide.","source":"Neumática, pág. 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[21]},{"id":59,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":true,"claim":"El sistema neumático del APU también incorpora protección frente a flujo inverso.","why":"Junto a la válvula de sangrado del APU hay una válvula antirretorno para evitar que el flujo regrese hacia el APU.","source":"Neumática, pág. 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[21]},{"id":60,"system":"Neumática · ATA 36","theme":"Tierra y APU","answer":false,"claim":"El carro de tierra y el APU se conectan a lados opuestos del conducto transversal, tal como se describe en la presentación.","why":"Ambas fuentes alimentan el lado izquierdo del conducto transversal en el esquema explicado.","source":"Neumática, pág. 14","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14]},{"id":61,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":true,"claim":"En funcionamiento normal, el A320 representado toma aire de la quinta etapa del compresor de alta presión.","why":"La diapositiva 18 identifica la etapa 5 como extracción normal de sangrado.","source":"Neumática, pág. 18","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18]},{"id":62,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":false,"claim":"Cuando el motor del A320 representado está al ralentí, el sangrado procede necesariamente de la etapa 5 y la HPV permanece cerrada.","why":"Al ralentí el material indica que se utiliza la etapa 9 a través de la HPV.","source":"Neumática, pág. 18","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18]},{"id":63,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":true,"claim":"La HPV regula aproximadamente a 36 psi, con una tolerancia citada de ±4 psi.","why":"La diapositiva 22 indica ese valor de regulación cuando la válvula está abierta.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":64,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":false,"claim":"La PRV regula a 36 psi y la HPV a 44 psi en el A320 descrito.","why":"Es al revés: la HPV se asocia a 36 ±4 psi y la PRV a 44 ±4 psi.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":65,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":true,"claim":"El regulador de la HPV puede cerrarla cuando la presión aportada por la quinta etapa es suficiente.","why":"Según la diapositiva 22, al superar el umbral descrito, la regulación interna cierra la mariposa de la vía de alta presión.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":66,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":false,"claim":"La HPV se mantiene abierta de forma permanente una vez que el motor alcanza un régimen elevado.","why":"Al aumentar la presión disponible en la etapa intermedia, la vía de alta presión puede cerrarse; no se describe apertura permanente.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":67,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":true,"claim":"Las dos vías de extracción del compresor se unen antes de la válvula reguladora PRV.","why":"La diapositiva 22 explica que ambos sangrados convergen en un único conducto hacia la PRV.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":68,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":false,"claim":"La PRV se sitúa aguas arriba de las tomas de sangrado de las etapas quinta y novena.","why":"Primero se extrae y reúne el aire de esas tomas; después atraviesa la PRV.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":69,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":true,"claim":"Tanto la HPV como la PRV se describen como válvulas con muelle que tiende a cerrarlas y actuación neumática.","why":"El documento indica explícitamente el cierre por muelle y la actuación por presión neumática.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":70,"system":"Neumática · ATA 36","theme":"HPV y PRV","answer":false,"claim":"Que la PRV regule a 44 psi significa que el sistema se cierra automáticamente en cuanto alcanza exactamente 44 psi.","why":"La PRV modula su apertura para mantener la presión de salida alrededor del valor de consigna; el cierre por fallo es un mecanismo diferente.","source":"Neumática, pág. 22, 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,24]},{"id":71,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":true,"claim":"El solenoide del TLT puede provocar el cierre de la PRV a partir de órdenes manuales o automáticas.","why":"La diapositiva 24 separa el cierre manual por mandos y el cierre automático ordenado por el BMC ante determinadas condiciones.","source":"Neumática, pág. 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":72,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":false,"claim":"Al pulsar ENG BLEED OFF, la válvula PRV debe abrirse para compensar la orden de desconexión.","why":"La orden OFF es una condición manual que desencadena el cierre del sangrado mediante el TLT/PRV.","source":"Neumática, pág. 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":73,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":true,"claim":"La actuación del pulsador cortafuegos del motor es una condición de cierre manual del sangrado de ese motor.","why":"El material la incluye junto a ENG BLEED OFF como orden de protección.","source":"Neumática, pág. 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":74,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":false,"claim":"El umbral de sobrepresión que desencadena el cierre automático de la PRV es de 44 psi.","why":"44 ±4 psi es la consigna de regulación de la PRV; la protección automática por sobrepresión se cita a 57 psi.","source":"Neumática, pág. 22, 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,24]},{"id":75,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":true,"claim":"El valor de 57 psi aparece en el material como umbral de sobrepresión detectada después de la PRV.","why":"La señal del transmisor RPT permite al BMC actuar si se alcanza el valor indicado.","source":"Neumática, pág. 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":76,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":false,"claim":"Una temperatura de 200 °C después del precooler equivale por sí sola al disparo automático por sobretemperatura del BMC.","why":"200 ±15 °C es la referencia de regulación del TCT; el umbral de sobretemperatura de cierre del BMC que se cita es 257 °C.","source":"Neumática, pág. 24, 32","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24,32]},{"id":77,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":true,"claim":"La secuencia de arranque del motor correspondiente puede ser una condición de cierre del sangrado de ese motor.","why":"La diapositiva 24 relaciona el cierre automático con la señal de apertura de la válvula de arranque.","source":"Neumática, pág. 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":78,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":false,"claim":"La selección del sangrado del APU obliga a los BMC a abrir la PRV del motor como respaldo inmediato.","why":"La diapositiva 24 incluye la apertura de la válvula de APU entre las condiciones que ordenan el cierre del sangrado de motor.","source":"Neumática, pág. 24","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":79,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":true,"claim":"El TLT puede intervenir neumáticamente frente al flujo inverso, además de recibir órdenes eléctricas de cierre.","why":"El temario explica que una presión diferencial desfavorable hace abrir una válvula interna del TLT y acaba cerrando la PRV.","source":"Neumática, pág. 24, 25","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24,25]},{"id":80,"system":"Neumática · ATA 36","theme":"TLT y protección","answer":false,"claim":"En el ejemplo de la diapositiva 25, la varilla del limitador térmico actúa únicamente porque aumenta la presión, sin depender de la temperatura.","why":"El esquema explica una dilatación del elemento térmico en torno a 235-245 °C; es un mecanismo de detección térmica.","source":"Neumática, pág. 25","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[25]},{"id":81,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":true,"claim":"La OPV se coloca después de la PRV en el recorrido del aire de sangrado.","why":"El texto de la diapositiva 22 sitúa la válvula de sobrepresión a continuación de la PRV y antes del precooler.","source":"Neumática, pág. 22","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":82,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":false,"claim":"La OPV está destinada principalmente a controlar la temperatura del aire a la salida del precooler.","why":"Su función es la protección por presión; la regulación de temperatura se atribuye al conjunto TCT, FAV y precooler.","source":"Neumática, pág. 22, 31, 32, 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,31,32,33]},{"id":83,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":true,"claim":"El intervalo 73,8-89,9 psi se muestra en la diapositiva dedicada a la OPV.","why":"La diapositiva 31 asocia ese intervalo a la válvula de protección por sobrepresión, no a la presión normal de la PRV.","source":"Neumática, pág. 31","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":84,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":false,"claim":"El intervalo 73,8-89,9 psi corresponde a la temperatura normal de salida del precooler.","why":"Son valores de presión indicados junto a la OPV y están expresados en psi, no en grados Celsius.","source":"Neumática, pág. 31","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":85,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":true,"claim":"En el precooler existen dos corrientes de aire con diferentes temperaturas que intercambian calor.","why":"Una corriente es el sangrado caliente del motor y la otra es el aire más frío procedente del fan.","source":"Neumática, pág. 7, 22, 31","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7,22,31]},{"id":86,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":false,"claim":"El aire del fan tiene que mezclarse directamente con el sangrado del motor para que el precooler pueda enfriarlo.","why":"El precooler se presenta como un intercambiador: intercambia calor entre las corrientes, no como una cámara cuya función sea mezclarlas.","source":"Neumática, pág. 7, 31","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7,31]},{"id":87,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":true,"claim":"El caudal del aire de refrigeración del precooler se modifica mediante la válvula de fan.","why":"La FAV regula el aire del fan que pasa por el precooler, adaptando la refrigeración a la temperatura del sangrado.","source":"Neumática, pág. 22, 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,33]},{"id":88,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":false,"claim":"La FAV debe aumentar el sangrado extraído del compresor de alta para enfriar el aire del precooler.","why":"La FAV actúa sobre el aire de refrigeración procedente del fan, no sobre la extracción principal del compresor.","source":"Neumática, pág. 7, 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7,33]},{"id":89,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":true,"claim":"Una pérdida de control de presión en la PRV y una pérdida de control térmico del precooler son situaciones distintas.","why":"La presión se regula mediante la PRV y se protege con la OPV/BMC; la temperatura se regula mediante TCT, FAV y precooler y se supervisa con sensores.","source":"Neumática, pág. 22, 24, 31, 32, 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,24,31,32,33]},{"id":90,"system":"Neumática · ATA 36","theme":"OPV y precooler","answer":false,"claim":"La OPV se describe como la válvula que el piloto utiliza normalmente para seleccionar manualmente la fuente APU.","why":"La OPV protege frente a presiones excesivas; la selección del APU se realiza mediante APU BLEED y su válvula asociada.","source":"Neumática, pág. 15, 21, 31","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[15,21,31]},{"id":91,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":true,"claim":"El TCT busca mantener la temperatura del sangrado a la salida del precooler en torno a 200 ±15 °C.","why":"La diapositiva 32 da esa referencia de temperatura para el control térmico del sangrado.","source":"Neumática, pág. 32","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32]},{"id":92,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":false,"claim":"El TCT regula directamente la presión de la PRV a 44 psi utilizando el caudal de combustible del motor.","why":"El TCT actúa sobre la línea de señal hacia la FAV para regular refrigeración; la PRV tiene su propio regulador de presión.","source":"Neumática, pág. 22, 32","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,32]},{"id":93,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":true,"claim":"Cuando la sonda del TCT se calienta lo suficiente, su dilatación permite que el muelle abra una válvula reductora de señal.","why":"El mecanismo descrito incluye sonda, varilla, ventilación y una válvula reductora que deja pasar presión regulada hacia la FAV.","source":"Neumática, pág. 32","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32]},{"id":94,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":false,"claim":"Si el sangrado supera 200 °C, el TCT ordena que se cierre la FAV para reducir el aire frío que circula por el precooler.","why":"El TCT aumenta la señal neumática de apertura de la FAV, dejando pasar más aire del fan y aumentando la refrigeración.","source":"Neumática, pág. 32, 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32,33]},{"id":95,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":true,"claim":"La FAV es una válvula de mariposa que tiende a cerrarse por efecto de un muelle.","why":"La presión de control enviada por el TCT vence el muelle y abre la mariposa cuando se requiere enfriamiento.","source":"Neumática, pág. 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[33]},{"id":96,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":false,"claim":"La FAV se abre porque su actuador recibe una orden de presión desde el depósito de agua potable.","why":"El material describe una línea sensora neumática procedente del TCT; no un mando del depósito de agua.","source":"Neumática, pág. 32, 33","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32,33]},{"id":97,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":true,"claim":"En operación manual, las posiciones OPEN y SHUT de X-BLEED no dependen de la posición de la válvula de sangrado del APU.","why":"La diapositiva 34 indica que estas selecciones son órdenes fijas de apertura o cierre ejecutadas por el motor eléctrico n.º 2.","source":"Neumática, pág. 34","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":98,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":false,"claim":"El motor eléctrico n.º 2 de la crossbleed es el que se utiliza según la diapositiva para la operación automática normal.","why":"El documento asigna la operación automática al motor n.º 1 y la manual al motor n.º 2.","source":"Neumática, pág. 34","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":99,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":true,"claim":"Si se detecta una pérdida neumática durante una secuencia de arranque, el material describe una excepción en la que la crossbleed permanece abierta hasta finalizarla.","why":"La diapositiva 34 explica esa permanencia temporal abierta en el contexto específico de una fuga detectada durante el arranque.","source":"Neumática, pág. 34","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":100,"system":"Neumática · ATA 36","theme":"TCT, FAV y crossbleed","answer":false,"claim":"En X-BLEED AUTO la válvula permanece abierta permanentemente, incluso con el sangrado del APU cerrado.","why":"En la regla descrita, AUTO sigue la señal de APU BLEED: con el sangrado de APU cerrado, se manda el cierre de crossbleed, salvo las condiciones especiales tratadas.","source":"Neumática, pág. 16, 34","level":2,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":101,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"Si la quinta etapa aporta 25 psi y la novena presión suficiente, el aire puede pasar por la HPV para regularse a unos 36 psi.","why":"En ralentí, la vía de la etapa 9 y la HPV aportan presión cuando la etapa 5 no basta; la PRV no puede aumentar una presión de entrada insuficiente.","source":"Neumática, pág. 22, 28","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,28]},{"id":102,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"Con 25 psi en la quinta etapa, la HPV permanece siempre cerrada y la PRV eleva la presión hasta 44 psi.","why":"En ralentí, la vía de la etapa 9 y la HPV aportan presión cuando la etapa 5 no basta; la PRV no puede aumentar una presión de entrada insuficiente.","source":"Neumática, pág. 22, 28","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,28]},{"id":103,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"Con 40 psi en la etapa 5, la HPV puede cerrarse mientras la PRV permanece abierta del todo.","why":"40 psi supera los 36 psi de referencia de la HPV pero no llega a los 44 psi de regulación de la PRV.","source":"Neumática, pág. 22, 28","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,28]},{"id":104,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"Con 40 psi en la etapa 5, la HPV y la PRV tienen que cerrar simultáneamente.","why":"40 psi supera los 36 psi de referencia de la HPV pero no llega a los 44 psi de regulación de la PRV.","source":"Neumática, pág. 22, 28","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22,28]},{"id":105,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"Con 100 psi disponibles desde la etapa 5, la PRV regula aproximadamente a 44 ± 4 psi.","why":"Con presión suficiente desde la etapa intermedia, la PRV reduce la presión a su consigna; la HPV no hace falta.","source":"Neumática, pág. 22","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":106,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"Con 100 psi en la etapa 5, el conducto de sangrado entrega necesariamente 100 psi a los packs.","why":"Con presión suficiente desde la etapa intermedia, la PRV reduce la presión a su consigna; la HPV no hace falta.","source":"Neumática, pág. 22","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":107,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"La etapa 5 proporciona la toma intermedia y la etapa 9 la toma de alta presión del esquema representativo.","why":"El esquema de la diapositiva 18 distingue 5ª IP y 9ª HP; no hay que invertirlas.","source":"Neumática, pág. 18, 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18,22]},{"id":108,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"En el esquema representativo, la quinta etapa es la toma HP y la novena es la toma intermedia.","why":"El esquema de la diapositiva 18 distingue 5ª IP y 9ª HP; no hay que invertirlas.","source":"Neumática, pág. 18, 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18,22]},{"id":109,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"La válvula IPCV evita el retorno de aire desde el colector hacia la toma intermedia del compresor.","why":"La IPCV es una válvula antirretorno; regula el sentido del flujo, no genera presión.","source":"Neumática, pág. 18, 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18,22]},{"id":110,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"La IPCV es un regulador que comprime el aire de etapa 5 cuando le faltan psi.","why":"La IPCV es una válvula antirretorno; regula el sentido del flujo, no genera presión.","source":"Neumática, pág. 18, 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[18,22]},{"id":111,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"Con la etapa 5 por encima de 36 psi, la HPV deja de ser necesaria para alimentar la red.","why":"La presión suficiente de la etapa intermedia fuerza el cierre de la vía HP.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":112,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"En crucero la HPV debe estar totalmente abierta porque es la etapa de mayor presión.","why":"La presión suficiente de la etapa intermedia fuerza el cierre de la vía HP.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":113,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"Si ni la toma de alta presión alcanza 36 psi, una HPV abierta no puede crear por sí sola los 36 psi.","why":"Una válvula reguladora puede estrangular o cerrar, pero no actuar como compresor ni elevar la presión de entrada.","source":"Neumática, pág. 22","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":114,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"La HPV siempre garantiza exactamente 36 psi, aunque su alimentación esté a 20 psi.","why":"Una válvula reguladora puede estrangular o cerrar, pero no actuar como compresor ni elevar la presión de entrada.","source":"Neumática, pág. 22","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":115,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"La PRV está situada aguas abajo de la convergencia de los dos caminos de sangrado.","why":"El aire IP y HP se reúne antes de entrar en la PRV, y después sigue hacia OPV y precooler.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":116,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"La PRV se sitúa dentro de la etapa 5, antes de la IPCV.","why":"El aire IP y HP se reúne antes de entrar en la PRV, y después sigue hacia OPV y precooler.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":117,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"El aire de la etapa 9 puede mantener cerrada la IPCV si su presión es mayor que la del camino IP.","why":"La antirretorno impide el retorno del flujo y puede quedar cerrada cuando predomina la presión de la vía HP.","source":"Neumática, pág. 22","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":118,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"Cuando se usa la etapa 9, la IPCV se abre automáticamente para devolver el sobrante a la etapa 5.","why":"La antirretorno impide el retorno del flujo y puede quedar cerrada cuando predomina la presión de la vía HP.","source":"Neumática, pág. 22","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":119,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":true,"claim":"La mariposa de la HPV puede estar cerrada con la mariposa de la PRV regulando.","why":"La HPV puede cerrar por presión suficiente en la 5ª etapa; el enlace obligatorio funciona al revés cuando se manda el cierre de la PRV.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":120,"system":"Neumática · ATA 36","theme":"NEU · Etapas y regulación","answer":false,"claim":"Siempre que la HPV cierra, la PRV tiene que cerrar por el mismo motivo.","why":"La HPV puede cerrar por presión suficiente en la 5ª etapa; el enlace obligatorio funciona al revés cuando se manda el cierre de la PRV.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":121,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"Una orden de cierre de la PRV hace cerrar también la HPV debido al enlace de sus cámaras de control.","why":"La cámara de control de la PRV y la de apertura de la HPV están relacionadas neumáticamente; la HPV es esclava en el cierre.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":122,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"Si la PRV cierra, la HPV permanece necesariamente abierta para compensarla.","why":"La cámara de control de la PRV y la de apertura de la HPV están relacionadas neumáticamente; la HPV es esclava en el cierre.","source":"Neumática, pág. 22","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[22]},{"id":123,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"Cuando la presión regulada llega al umbral de supervisión de 57 psi, la BMC puede ordenar el cierre de sangrado.","why":"La protección electrónica mediante BMC/TLT se asocia a 57 psi; la OPV es una protección mecánica posterior con límites mayores.","source":"Neumática, pág. 24","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":124,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"La BMC espera a 90 psi para mandar cerrar la PRV por una sobrepresión detectada.","why":"La protección electrónica mediante BMC/TLT se asocia a 57 psi; la OPV es una protección mecánica posterior con límites mayores.","source":"Neumática, pág. 24","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":125,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"El TLT puede cerrar neumáticamente la PRV al detectar flujo inverso, incluso sin la orden eléctrica del BMC.","why":"Un diafragma compara presiones antes y después: si la de aguas abajo vence, abre el venteo y corta el sangrado.","source":"Neumática, pág. 25","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[25]},{"id":126,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"Un flujo inverso solo puede detectarse mediante un interruptor manual de cabina.","why":"Un diafragma compara presiones antes y después: si la de aguas abajo vence, abre el venteo y corta el sangrado.","source":"Neumática, pág. 25","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[25]},{"id":127,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"La limitación térmica neumática del TLT actúa aproximadamente entre 235 y 245 °C.","why":"El TLT es un termostato limitador de alta temperatura; 44 psi corresponde a presión, no a grados Celsius.","source":"Neumática, pág. 25","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[25]},{"id":128,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"El TLT limita por temperatura exactamente a 44 °C, igual que la referencia de la PRV.","why":"El TLT es un termostato limitador de alta temperatura; 44 psi corresponde a presión, no a grados Celsius.","source":"Neumática, pág. 25","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[25]},{"id":129,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"A una temperatura crítica de unos 257 °C, la BMC ordena un corte eléctrico del sangrado mediante el TLT.","why":"Se diferencia la reducción neumática en 235–245 °C del corte por sobretemperatura supervisado a 257 °C.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":130,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"La BMC interpreta 257 °C como temperatura nominal y abre la PRV para calentar más.","why":"Se diferencia la reducción neumática en 235–245 °C del corte por sobretemperatura supervisado a 257 °C.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":131,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"El solenoide asociado al TLT puede ventear el conducto de control y dejar que el muelle cierre la PRV.","why":"Su función está en el mando neumático de la PRV: el venteo elimina la presión que la mantenía abierta.","source":"Neumática, pág. 24, 25","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24,25]},{"id":132,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"El solenoide del TLT sirve para inyectar combustible en la turbina cuando falla la PRV.","why":"Su función está en el mando neumático de la PRV: el venteo elimina la presión que la mantenía abierta.","source":"Neumática, pág. 24, 25","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24,25]},{"id":133,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"Pulsar ENG BLEED OFF es una condición manual que puede desencadenar el cierre de la PRV.","why":"La orden manual se procesa para despresurizar la línea de mando de sangrado y cerrar las válvulas.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":134,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"Poner ENG BLEED en OFF solo desconecta una luz: el sangrado sigue abierto obligatoriamente.","why":"La orden manual se procesa para despresurizar la línea de mando de sangrado y cerrar las válvulas.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":135,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"Accionar el pulsador de fuego del motor es otra condición de cierre del sangrado de ese motor.","why":"La actuación del pulsador de fuego incluye el aislamiento de fuentes y el cierre de la vía neumática afectada.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":136,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"En caso de fuego se fuerza la PRV a abrir para ventilar el motor con aire caliente.","why":"La actuación del pulsador de fuego incluye el aislamiento de fuentes y el cierre de la vía neumática afectada.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":137,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"Durante la secuencia de arranque de un motor, su PRV de sangrado puede mantenerse cerrada para no alimentar el colector desde ese motor.","why":"El aire de la fuente externa/APU entra por la válvula de arranque; la PRV del motor arrancado se mantiene aislada.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":138,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"Durante el arranque, el motor que está arrancando debe abrir su PRV para que el aire del APU vuelva hacia él.","why":"El aire de la fuente externa/APU entra por la válvula de arranque; la PRV del motor arrancado se mantiene aislada.","source":"Neumática, pág. 24","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[24]},{"id":139,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":true,"claim":"Un fusible térmico de protección puede despresurizar el mando de la PRV si se alcanza una temperatura extrema.","why":"El material señala un elemento de protección térmica que ventea la línea de mando en temperaturas extremas, no un aumento de presión.","source":"Neumática, pág. 27","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[27]},{"id":140,"system":"Neumática · ATA 36","theme":"NEU · Protección PRV y TLT","answer":false,"claim":"Un fusible térmico de la PRV eleva automáticamente su referencia a 450 psi.","why":"El material señala un elemento de protección térmica que ventea la línea de mando en temperaturas extremas, no un aumento de presión.","source":"Neumática, pág. 27","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[27]},{"id":141,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"La OPV permanece abierta por acción de su muelle durante el funcionamiento normal.","why":"La válvula de sobrepresión tiene comportamiento de muelle abierto; HPV y PRV, en cambio, tienden al cierre por muelle.","source":"Neumática, pág. 31","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":142,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"La OPV está normalmente cerrada por muelle y la BMC debe abrirla continuamente.","why":"La válvula de sobrepresión tiene comportamiento de muelle abierto; HPV y PRV, en cambio, tienden al cierre por muelle.","source":"Neumática, pág. 31","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":143,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"Si la presión anormal sube a la zona de 74 psi, la OPV empieza su movimiento de cierre.","why":"El margen aproximado 73,8–89,9 psi corresponde al cierre progresivo de protección por sobrepresión.","source":"Neumática, pág. 31","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":144,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"La OPV comienza a abrir con sobrepresión a unos 74 psi para dejar circular más aire.","why":"El margen aproximado 73,8–89,9 psi corresponde al cierre progresivo de protección por sobrepresión.","source":"Neumática, pág. 31","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":145,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"A unos 90 psi de sobrepresión, la OPV puede alcanzar su cierre completo.","why":"La OPV es una barrera de seguridad si la regulación principal de la PRV no contiene la presión.","source":"Neumática, pág. 31","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":146,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"A 90 psi, la OPV debe estar totalmente abierta porque es la válvula que regula 90 psi.","why":"La OPV es una barrera de seguridad si la regulación principal de la PRV no contiene la presión.","source":"Neumática, pág. 31","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":147,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"El aire sangrado caliente fluye por tubos del precooler y se enfría sin mezclarse con el aire frío del fan.","why":"El precooler es un intercambiador de calor, no una cámara de mezcla de las corrientes.","source":"Neumática, pág. 31","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":148,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"En el precooler, el sangrado y el aire del fan se mezclan deliberadamente para bajar la temperatura.","why":"El precooler es un intercambiador de calor, no una cámara de mezcla de las corrientes.","source":"Neumática, pág. 31","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31]},{"id":149,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"La sonda del TCT detecta la temperatura del aire a la salida del precooler.","why":"La función del TCT es mantener la temperatura del aire neumático suministrado tras el intercambiador.","source":"Neumática, pág. 32","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32]},{"id":150,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"El TCT detecta directamente la temperatura del aceite del motor para gobernar la bomba hidráulica.","why":"La función del TCT es mantener la temperatura del aire neumático suministrado tras el intercambiador.","source":"Neumática, pág. 32","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32]},{"id":151,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"El objetivo de control de la salida del precooler se sitúa en torno a 200 ± 15 °C.","why":"200 ± 15 es una temperatura en grados Celsius; no debe confundirse con la presión de la PRV.","source":"Neumática, pág. 32","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32]},{"id":152,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"El objetivo térmico del TCT se expresa como 200 ± 15 psi.","why":"200 ± 15 es una temperatura en grados Celsius; no debe confundirse con la presión de la PRV.","source":"Neumática, pág. 32","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32]},{"id":153,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"Si aumenta demasiado la temperatura a la salida del precooler, el TCT puede abrir más la FAV.","why":"Más apertura de la FAV deja pasar más aire frío del fan y aumenta la transferencia de calor.","source":"Neumática, pág. 32, 33","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32,33]},{"id":154,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"Si aumenta la temperatura, el TCT obliga a cerrar la FAV para reducir la cantidad de aire frío.","why":"Más apertura de la FAV deja pasar más aire frío del fan y aumenta la transferencia de calor.","source":"Neumática, pág. 32, 33","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[32,33]},{"id":155,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"La FAV tiene un muelle que tiende a cerrarla cuando no recibe suficiente señal neumática de apertura.","why":"El regulador TCT modula la presión de señal hacia el actuador de la FAV para vencer su muelle.","source":"Neumática, pág. 33","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[33]},{"id":156,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"La FAV tiene un muelle que la obliga a abrir siempre, independientemente de la señal del TCT.","why":"El regulador TCT modula la presión de señal hacia el actuador de la FAV para vencer su muelle.","source":"Neumática, pág. 33","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[33]},{"id":157,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"El aire empleado para enfriar en el precooler procede del fan, no de una mezcla de combustible y nitrógeno.","why":"Se aprovecha una segunda corriente de aire más fría procedente del fan.","source":"Neumática, pág. 7, 31","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7,31]},{"id":158,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"La refrigeración del precooler consiste en inyectar combustible líquido sobre el aire caliente.","why":"Se aprovecha una segunda corriente de aire más fría procedente del fan.","source":"Neumática, pág. 7, 31","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[7,31]},{"id":159,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":true,"claim":"La OPV protege presión y el conjunto TCT/FAV controla temperatura: son funciones diferentes.","why":"El TCT modula enfriamiento; la OPV actúa frente a sobrepresión y no mantiene 200 °C.","source":"Neumática, pág. 31, 32","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31,32]},{"id":160,"system":"Neumática · ATA 36","theme":"NEU · Refrigeración, OPV y FAV","answer":false,"claim":"El TCT es la válvula mecánica encargada de cerrar a 90 psi cuando falla la PRV.","why":"El TCT modula enfriamiento; la OPV actúa frente a sobrepresión y no mantiene 200 °C.","source":"Neumática, pág. 31, 32","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[31,32]},{"id":161,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"Con X-BLEED en AUTO y sangrado del APU abierto, normalmente se ordena la apertura de la X-BLEED si no hay fugas ni pulsadores de fuego accionados.","why":"AUTO sigue la señal de la válvula APU BLEED cuando las condiciones de seguridad permiten abrir.","source":"Neumática, pág. 16, 34","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":162,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"Con X-BLEED en AUTO y APU BLEED abierto, el sistema ordena incondicionalmente cerrar la conexión cruzada.","why":"AUTO sigue la señal de la válvula APU BLEED cuando las condiciones de seguridad permiten abrir.","source":"Neumática, pág. 16, 34","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":163,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"Con X-BLEED en AUTO y válvula de sangrado del APU cerrada, la válvula cruzada suele quedar cerrada.","why":"La regla normal de AUTO es seguir el estado de la APU; compartir sangrado de un motor suele requerir seleccionar OPEN.","source":"Neumática, pág. 16, 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":164,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"Con X-BLEED en AUTO y la APU apagada, la conexión cruzada queda siempre abierta para compartir ambos motores.","why":"La regla normal de AUTO es seguir el estado de la APU; compartir sangrado de un motor suele requerir seleccionar OPEN.","source":"Neumática, pág. 16, 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[16,34]},{"id":165,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"En X-BLEED OPEN, el motor eléctrico número 2 actúa como accionamiento manual de la válvula.","why":"El motor n.º 1 realiza control automático por la BMC; el n.º 2 atiende selección manual OPEN/SHUT.","source":"Neumática, pág. 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":166,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"La BMC usa el motor eléctrico número 2 para llevar automáticamente la X-BLEED al estado de la APU.","why":"El motor n.º 1 realiza control automático por la BMC; el n.º 2 atiende selección manual OPEN/SHUT.","source":"Neumática, pág. 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":167,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"En AUTO, las BMC ordenan la X-BLEED mediante el motor eléctrico número 1.","why":"El esquema de la diapositiva 34 distingue motor 1 control automático y motor 2 mando manual eléctrico.","source":"Neumática, pág. 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":168,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"En AUTO, la válvula X-BLEED es accionada neumáticamente por la presión de los depósitos verdes.","why":"El esquema de la diapositiva 34 distingue motor 1 control automático y motor 2 mando manual eléctrico.","source":"Neumática, pág. 34","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[34]},{"id":169,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"Alimentar el lado izquierdo desde la APU y abrir X-BLEED permite hacer llegar aire a la válvula de arranque del motor 2.","why":"El crossbleed une ambos lados, así que una fuente APU puede suministrar aire al arrancador del lado opuesto.","source":"Neumática, pág. 14, 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,21]},{"id":170,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"Como la APU entra por el lado izquierdo, no puede arrancar el motor 2 ni con X-BLEED abierta.","why":"El crossbleed une ambos lados, así que una fuente APU puede suministrar aire al arrancador del lado opuesto.","source":"Neumática, pág. 14, 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,21]},{"id":171,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"La toma de aire neumático de tierra y la del APU se conectan al lado izquierdo de la distribución transversal.","why":"En el esquema del A320 tratado, ambas fuentes externas se incorporan por el lado izquierdo del colector.","source":"Neumática, pág. 14, 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,21]},{"id":172,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"La toma de tierra alimenta exclusivamente el lado derecho y la APU exclusivamente el izquierdo, por obligación.","why":"En el esquema del A320 tratado, ambas fuentes externas se incorporan por el lado izquierdo del colector.","source":"Neumática, pág. 14, 21","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,21]},{"id":173,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"Si se detecta fuga en un conducto, la BMC puede aislar la zona cerrando el sangrado afectado.","why":"El aislamiento neumático evita alimentar una pérdida y limita daños por aire muy caliente.","source":"Neumática, pág. 19","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":174,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"Una fuga detectada obliga a la BMC a aumentar la presión del sangrado para compensar.","why":"El aislamiento neumático evita alimentar una pérdida y limita daños por aire muy caliente.","source":"Neumática, pág. 19","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[19]},{"id":175,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"La prioridad del APU implica que los sangrados de motor pueden cerrarse cuando se selecciona aire del APU.","why":"Las BMC coordinan el aislamiento de los sangrados del motor cuando se suministra aire del APU.","source":"Neumática, pág. 15","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[15]},{"id":176,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"La prioridad del APU hace que el aire APU se mezcle necesariamente con los sangrados de los dos motores.","why":"Las BMC coordinan el aislamiento de los sangrados del motor cuando se suministra aire del APU.","source":"Neumática, pág. 15","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[15]},{"id":177,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"Una X-BLEED cerrada permite mantener separados los circuitos neumáticos izquierdo y derecho.","why":"La función de aislamiento del conducto transversal depende de la posición abierta o cerrada de esa válvula.","source":"Neumática, pág. 14, 16","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,16]},{"id":178,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"Con X-BLEED cerrada, los dos lados intercambian aire libremente por el conducto transversal.","why":"La función de aislamiento del conducto transversal depende de la posición abierta o cerrada de esa válvula.","source":"Neumática, pág. 14, 16","level":2,"exam":false,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,16]},{"id":179,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":true,"claim":"Con el motor 2 sin sangrado y la APU cerrada, seleccionar manualmente OPEN puede permitir al motor 1 alimentar también el lado derecho, si no hay fallo que lo impida.","why":"La conexión transversal abierta comunica ambas ramas y habilita alimentación cruzada desde una fuente disponible.","source":"Neumática, pág. 14, 16","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,16]},{"id":180,"system":"Neumática · ATA 36","theme":"NEU · APU, BMC y X-BLEED","answer":false,"claim":"Si falla el sangrado del motor 2, el motor 1 jamás puede suministrar aire al lado derecho del A320.","why":"La conexión transversal abierta comunica ambas ramas y habilita alimentación cruzada desde una fuente disponible.","source":"Neumática, pág. 14, 16","level":3,"exam":true,"pdf":"SISTEMA NEUMÁTICO_PROPIS.pdf","pdfPages":[14,16]},{"id":181,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"El sistema verde es un circuito hidráulico del A320 que trabaja nominalmente alrededor de 3000 psi.","why":"La presión nominal hidráulica es 3000 psi; 44 psi es una referencia del sangrado neumático.","source":"Hidráulica GREEN, pág. 2, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":182,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"El sistema verde utiliza normalmente 44 psi de fluido hidráulico, igual que la PRV neumática.","why":"La presión nominal hidráulica es 3000 psi; 44 psi es una referencia del sangrado neumático.","source":"Hidráulica GREEN, pág. 2, 8","level":3,"exam":true,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":183,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"El sistema verde dispone de su propio depósito hidráulico y usuarios alimentados por él.","why":"Los circuitos son independientes hidráulicamente, aunque puedan intercambiar potencia mediante la PTU.","source":"Hidráulica GREEN, pág. 2","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":184,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"El sistema verde y el amarillo comparten un único depósito de fluido de forma habitual.","why":"Los circuitos son independientes hidráulicamente, aunque puedan intercambiar potencia mediante la PTU.","source":"Hidráulica GREEN, pág. 2","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2]},{"id":185,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"La EDP del motor 1 es la fuente de presurización principal del sistema verde.","why":"La bomba accionada por el motor 1 se identifica como ENG 1 PUMP y suministra hidráulica al GREEN.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":186,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"El sistema verde toma su presión habitual de una bomba de combustible del motor 2.","why":"La bomba accionada por el motor 1 se identifica como ENG 1 PUMP y suministra hidráulica al GREEN.","source":"Hidráulica GREEN, pág. 2, 8","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[2,8]},{"id":187,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"La dirección de la rueda de morro es uno de los usuarios del sistema verde.","why":"La lista de usuarios de la diapositiva 7 conecta NOSE WHEEL STEERING al GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":188,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"La dirección de la rueda de morro funciona exclusivamente con aire neumático de la APU.","why":"La lista de usuarios de la diapositiva 7 conecta NOSE WHEEL STEERING al GREEN.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":189,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"Los frenos normales reciben alimentación del sistema verde.","why":"En el diagrama general, NORMAL BRAKES aparece conectado a la rama verde.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":190,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":false,"claim":"Los frenos normales del A320 siempre trabajan sin ninguna presión hidráulica.","why":"En el diagrama general, NORMAL BRAKES aparece conectado a la rama verde.","source":"Hidráulica GREEN, pág. 7","level":2,"exam":false,"pdf":"ATA 29 HIDRÁULICO_PROPIS.pdf","pdfPages":[7]},{"id":191,"system":"Hidráulica GREEN · ATA 29","theme":"GREEN · Conceptos y usuarios","answer":true,"claim":"La reversa del motor 1 es uno de los usuarios que se alimentan desde el verde.","why":"La presentación sitúa REVERSE ENGINE 1 entre los usuar
